<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pedidos | VANTA</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#111;
}

header{
height:70px;
background:#000;
color:#fff;
display:flex;
align-items:center;
padding:0 6%;
}

.logo{
font-size:25px;
font-weight:bold;
letter-spacing:4px;
}

.container{
max-width:1000px;
margin:40px auto;
padding:20px;
}

.box{
background:#fff;
padding:25px;
border-radius:10px;
margin-bottom:20px;
}

.pedido{
border:1px solid #ddd;
padding:20px;
border-radius:8px;
margin-bottom:15px;
}

.pedido h2{
margin-top:0;
}

.status{
display:inline-block;
padding:8px 12px;
background:#eee;
border-radius:20px;
font-size:13px;
font-weight:bold;
}

.vazio{
text-align:center;
padding:40px 10px;
color:#777;
}

button{
width:100%;
padding:15px;
background:#000;
color:#fff;
border:0;
border-radius:5px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}
</style>
</head>

<body>

<header>
<div class="logo">VANTA</div>
</header>

<div class="container">

<div class="box">

<h1>Pedidos</h1>

<div id="lista"></div>

</div>

</div>

<script>

let pedidos=
JSON.parse(localStorage.getItem("vantaPedidos")) || [];

let lista=document.getElementById("lista");

function mostrarPedidos(){

if(pedidos.length===0){

lista.innerHTML=`
<div class="vazio">
<h2>Nenhum pedido ainda</h2>
<p>Os pedidos aparecerão aqui.</p>
</div>
`;

return;
}

lista.innerHTML="";

pedidos.forEach((pedido,index)=>{

lista.innerHTML+=`

<div class="pedido">

<h2>${pedido.produto}</h2>

<p>
<strong>Cliente:</strong>
${pedido.nome}
</p>

<p>
<strong>WhatsApp:</strong>
${pedido.whatsapp}
</p>

<p>
<strong>Endereço:</strong>
${pedido.endereco}
</p>

<p>
<strong>Pagamento:</strong>
${pedido.pagamento}
</p>

<p>
<strong>Total:</strong>
R$ ${pedido.total}
</p>

<span class="status">
${pedido.status}
</span>

</div>

`;

});

}

mostrarPedidos();

</script>

</body>
</html>
