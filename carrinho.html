<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carrinho | VANTA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0b0b;
  color:#fff;
}

header{
  height:70px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:4px;
}

.container{
  max-width:800px;
  margin:40px auto;
  padding:20px;
}

h1{
  font-size:30px;
  margin-bottom:25px;
}

.item{
  display:flex;
  gap:18px;
  padding:18px;
  margin-bottom:15px;
  background:#111;
  border:1px solid #222;
  border-radius:12px;
}

.item img{
  width:110px;
  height:130px;
  object-fit:cover;
  border-radius:8px;
}

.info{
  flex:1;
}

.nome{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.preco{
  font-size:17px;
  margin-bottom:8px;
}

.tamanho{
  color:#aaa;
  margin-bottom:12px;
}

.controle{
  display:flex;
  align-items:center;
  gap:12px;
}

.controle button{
  width:32px;
  height:32px;
  padding:0;
  border:1px solid #444;
  background:#1a1a1a;
  color:#fff;
  border-radius:6px;
  cursor:pointer;
  font-size:18px;
}

.remover{
  margin-top:12px;
  background:none;
  border:0;
  color:#888;
  cursor:pointer;
}

.remover:hover{
  color:#fff;
}

.resumo{
  margin-top:25px;
  padding:22px;
  background:#111;
  border:1px solid #222;
  border-radius:12px;
}

.total{
  font-size:24px;
  font-weight:bold;
  margin-bottom:18px;
}

.finalizar{
  display:block;
  width:100%;
  padding:17px;
  background:#fff;
  color:#000;
  text-align:center;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

.finalizar:hover{
  background:#ddd;
}

.vazio{
  text-align:center;
  padding:60px 20px;
  background:#111;
  border:1px solid #222;
  border-radius:12px;
}

.vazio h2{
  margin-bottom:10px;
}

.vazio p{
  color:#888;
}

@media(max-width:600px){

  .item{
    gap:12px;
  }

  .item img{
    width:90px;
    height:110px;
  }

}
</style>
</head>

<body>

<header>
  <div class="logo">VANTA</div>
</header>

<div class="container">

<h1>Seu carrinho</h1>

<div id="lista"></div>

<div id="resumo"></div>

</div>

<script>

let carrinho =
  JSON.parse(localStorage.getItem("vantaCarrinho")) || [];

/*
 Compatibilidade:
 se o carrinho antigo ainda for um único objeto,
 transformamos automaticamente em array.
*/

if(!Array.isArray(carrinho) && carrinho.nome){

  carrinho = [carrinho];

  localStorage.setItem(
    "vantaCarrinho",
    JSON.stringify(carrinho)
  );
}

function salvar(){

  localStorage.setItem(
    "vantaCarrinho",
    JSON.stringify(carrinho)
  );

}

function dinheiro(valor){

  return valor
    .toFixed(2)
    .replace(".",",");

}

function mostrar(){

  let lista =
    document.getElementById("lista");

  let resumo =
    document.getElementById("resumo");

  if(carrinho.length === 0){

    lista.innerHTML = `
      <div class="vazio">
        <h2>Carrinho vazio</h2>
        <p>Adicione algum produto para continuar.</p>
      </div>
    `;

    resumo.innerHTML = "";

    return;
  }

  lista.innerHTML = "";

  let total = 0;

  carrinho.forEach((produto,index)=>{

    let subtotal =
      produto.preco * produto.quantidade;

    total += subtotal;

    lista.innerHTML += `

      <div class="item">

        <img
          src="${produto.imagem || ""}"
          alt="${produto.nome}"
        >

        <div class="info">

          <div class="nome">
            ${produto.nome}
          </div>

          <div class="preco">
            R$ ${dinheiro(produto.preco)}
          </div>

          <div class="tamanho">
            Tamanho: ${produto.tamanho}
          </div>

          <div class="controle">

            <button onclick="diminuir(${index})">
              −
            </button>

            <span>
              ${produto.quantidade}
            </span>

            <button onclick="aumentar(${index})">
              +
            </button>

          </div>

          <button
            class="remover"
            onclick="remover(${index})"
          >
            Remover
          </button>

        </div>

      </div>

    `;

  });

  resumo.innerHTML = `

    <div class="resumo">

      <div class="total">
        Total: R$ ${dinheiro(total)}
      </div>

      <a
        href="checkout.html"
        class="finalizar"
      >
        FINALIZAR COMPRA
      </a>

    </div>

  `;

}

function aumentar(index){

  carrinho[index].quantidade++;

  salvar();
  mostrar();

}

function diminuir(index){

  carrinho[index].quantidade--;

  if(carrinho[index].quantidade <= 0){

    carrinho.splice(index,1);

  }

  salvar();
  mostrar();

}

function remover(index){

  carrinho.splice(index,1);

  salvar();
  mostrar();

}

mostrar();

</script>

</body>
</html>
