<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrinho | ANARKA</title>
<meta name="description" content="Seu carrinho ANARKA.">

<link rel="icon" href="/favicon.png">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#050505;
  color:#f5f5f5;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  opacity:.025;
  background:repeating-linear-gradient(
    0deg,
    #fff 0,
    #fff 1px,
    transparent 1px,
    transparent 3px
  );
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}

.topbar{
  background:#d60000;
  color:#fff;
  text-align:center;
  padding:9px 15px;
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* HEADER */

header{
  height:88px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  border-bottom:1px solid #262626;
  background:rgba(5,5,5,.97);
}

.logo{
  width:135px;
  height:70px;
  object-fit:contain;
}

nav{
  display:flex;
  align-items:center;
  gap:30px;
}

nav a{
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

nav a:hover{
  color:#d60000;
}

/* CONTAINER */

.container{
  max-width:1400px;
  margin:auto;
  padding:75px 6% 110px;
}

.page-label{
  color:#d60000;
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
  text-transform:uppercase;
}

h1{
  margin-top:12px;
  font-size:clamp(58px,9vw,125px);
  line-height:.78;
  letter-spacing:-6px;
  text-transform:uppercase;
}

h1 span{
  color:transparent;
  -webkit-text-stroke:1px #fff;
}

.cart-layout{
  margin-top:65px;
  display:grid;
  grid-template-columns:1.5fr .7fr;
  gap:45px;
  align-items:start;
}

/* ITENS */

.cart-items{
  border-top:1px solid #292929;
}

.item{
  display:grid;
  grid-template-columns:150px 1fr auto;
  gap:22px;
  padding:22px 0;
  border-bottom:1px solid #292929;
  align-items:center;
}

.item-image{
  width:150px;
  aspect-ratio:4/5;
  overflow:hidden;
  background:#111;
  border:1px solid #242424;
}

.item-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:grayscale(.55);
}

.item-tag{
  color:#d60000;
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

.item-name{
  margin-top:7px;
  font-size:20px;
  line-height:1.05;
  text-transform:uppercase;
}

.item-size{
  margin-top:9px;
  color:#777;
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.item-price{
  display:block;
  margin-top:15px;
  font-weight:900;
  font-size:17px;
}

.item-controls{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:20px;
}

.quantity{
  display:flex;
  border:1px solid #333;
}

.quantity button{
  width:38px;
  height:38px;
  border:0;
  background:#0b0b0b;
  color:#fff;
  cursor:pointer;
  font-size:17px;
}

.quantity span{
  width:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-left:1px solid #333;
  border-right:1px solid #333;
  font-size:12px;
  font-weight:900;
}

.remove{
  background:none;
  border:0;
  color:#666;
  cursor:pointer;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.remove:hover{
  color:#d60000;
}

/* RESUMO */

.summary{
  border:1px solid #333;
  background:#090909;
  padding:28px;
  position:sticky;
  top:25px;
}

.summary-label{
  color:#d60000;
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

.summary h2{
  margin-top:8px;
  font-size:28px;
  text-transform:uppercase;
}

.summary-line{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:18px 0;
  border-bottom:1px solid #242424;
  color:#888;
  font-size:12px;
}

.summary-line strong{
  color:#fff;
}

.summary-total{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-top:25px;
}

.summary-total span{
  color:#888;
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.summary-total strong{
  font-size:30px;
}

.checkout{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:60px;
  margin-top:27px;
  background:#fff;
  color:#000;
  border:1px solid #fff;
  font-size:11px;
  font-weight:1000;
  letter-spacing:2px;
  text-transform:uppercase;
  transition:.15s;
}

.checkout:hover{
  background:#d60000;
  color:#fff;
  border-color:#d60000;
  transform:translate(-3px,-3px);
  box-shadow:6px 6px 0 #fff;
}

.continue{
  display:block;
  margin-top:18px;
  text-align:center;
  color:#777;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.continue:hover{
  color:#fff;
}

/* VAZIO */

.empty{
  border:1px dashed #333;
  padding:80px 25px;
  text-align:center;
}

.empty-symbol{
  font-size:45px;
}

.empty h2{
  margin-top:20px;
  font-size:35px;
  text-transform:uppercase;
}

.empty p{
  margin:12px auto 25px;
  max-width:430px;
  color:#777;
  line-height:1.6;
}

.empty a{
  display:inline-flex;
  min-height:52px;
  align-items:center;
  justify-content:center;
  padding:0 23px;
  background:#d60000;
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* FRASE */

.statement{
  margin-top:100px;
  border-top:1px solid #292929;
  padding-top:65px;
}

.statement small{
  color:#d60000;
  font-weight:900;
  letter-spacing:3px;
}

.statement h2{
  margin-top:15px;
  font-size:clamp(40px,6vw,80px);
  line-height:.85;
  letter-spacing:-4px;
  text-transform:uppercase;
}

.statement h2 span{
  color:transparent;
  -webkit-text-stroke:1px #fff;
}

/* FOOTER */

footer{
  border-top:1px solid #222;
  padding:45px 6%;
  text-align:center;
  color:#555;
  font-size:10px;
  letter-spacing:2px;
}

footer img{
  display:block;
  width:120px;
  height:75px;
  object-fit:contain;
  margin:0 auto 10px;
}

/* MOBILE */

@media(max-width:900px){

  .cart-layout{
    grid-template-columns:1fr;
  }

  .summary{
    position:static;
  }

}

@media(max-width:650px){

  header{
    height:72px;
    padding:0 4%;
  }

  .logo{
    width:100px;
    height:58px;
  }

  nav a:first-child{
    display:none;
  }

  nav{
    gap:15px;
  }

  .container{
    padding:55px 4% 75px;
  }

  h1{
    letter-spacing:-4px;
  }

  .cart-layout{
    margin-top:45px;
  }

  .item{
    grid-template-columns:95px 1fr;
    gap:14px;
    position:relative;
  }

  .item-image{
    width:95px;
  }

  .item-name{
    font-size:14px;
  }

  .item-price{
    font-size:14px;
  }

  .item-controls{
    grid-column:1 / 3;
    flex-direction:row;
    justify-content:space-between;
    align-items:center;
  }

  .statement h2{
    letter-spacing:-2px;
  }

}

</style>
</head>

<body>

<div class="topbar">
  ANARKA — NÃO VISTA O PADRÃO
</div>

<header>

  <a href="index.html">
    <img
      src="/anarka-logo.png"
      alt="ANARKA"
      class="logo"
    >
  </a>

  <nav>
    <a href="index.html">Início</a>
    <a href="catalogo.html">Coleção</a>
  </nav>

</header>

<main class="container">

  <div class="page-label">
    ANARKA / SEU PEDIDO
  </div>

  <h1>
    SEU<br>
    <span>CARRINHO.</span>
  </h1>

  <div id="cartContent"></div>

  <section class="statement">

    <small>ANARKA / 001</small>

    <h2>
      ESCOLHA O QUE<br>
      <span>REPRESENTA VOCÊ.</span>
    </h2>

  </section>

</main>

<footer>

  <img
    src="/anarka-logo.png"
    alt="ANARKA"
  >

  © 2026 ANARKA — STREETWEAR / SÃO PAULO

</footer>

<script>

/* ============================================
   CARRINHO ANARKA

   IMPORTANTE:
   "vantaCarrinho" continua igual para manter
   compatibilidade com produto.html e checkout.
============================================ */

function pegarCarrinho(){

  try{

    let carrinho =
      JSON.parse(
        localStorage.getItem("vantaCarrinho")
      ) || [];

    if(!Array.isArray(carrinho)){
      carrinho =
        carrinho
        ? [carrinho]
        : [];
    }

    return carrinho;

  }catch{

    return [];

  }

}

function salvarCarrinho(carrinho){

  localStorage.setItem(
    "vantaCarrinho",
    JSON.stringify(carrinho)
  );

}

function dinheiro(valor){

  return Number(valor).toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );

}

/* ============================================
   TOTAL
============================================ */

function calcularTotal(carrinho){

  return carrinho.reduce(
    (total,item)=>{

      const preco =
        Number(item.preco) || 0;

      const quantidade =
        Number(item.quantidade) || 1;

      return total +
        (preco * quantidade);

    },
    0
  );

}

function calcularQuantidade(carrinho){

  return carrinho.reduce(
    (total,item)=>
      total +
      (Number(item.quantidade) || 1),
    0
  );

}

/* ============================================
   RENDER
============================================ */

function renderizarCarrinho(){

  const carrinho =
    pegarCarrinho();

  const container =
    document.getElementById("cartContent");

  if(carrinho.length === 0){

    container.innerHTML = `

      <div
        class="empty"
        style="margin-top:55px"
      >

        <div class="empty-symbol">
          Ⓐ
        </div>

        <h2>
          Seu carrinho está vazio.
        </h2>

        <p>
          A coleção continua esperando.
          Explore as peças ANARKA e escolha
          o que combina com a sua presença.
        </p>

        <a href="catalogo.html">
          VER COLEÇÃO →
        </a>

      </div>

    `;

    return;

  }

  const total =
    calcularTotal(carrinho);

  const quantidadeTotal =
    calcularQuantidade(carrinho);

  const itensHTML =
    carrinho.map((item,index)=>{

      const preco =
        Number(item.preco) || 0;

      const quantidade =
        Number(item.quantidade) || 1;

      const subtotal =
        preco * quantidade;

      const imagem =
        item.imagem ||
        "/anarka-logo.png";

      const nome =
        item.nome ||
        "Peça ANARKA";

      const tamanho =
        item.tamanho ||
        "-";

      return `

        <div class="item">

          <a
            href="${item.id
              ? `produto.html?id=${encodeURIComponent(item.id)}`
              : "catalogo.html"
            }"
            class="item-image"
          >

            <img
              src="${imagem}"
              alt="${nome}"
            >

          </a>

          <div class="item-info">

            <div class="item-tag">
              ANARKA / ITEM ${String(index + 1).padStart(2,"0")}
            </div>

            <a
              href="${item.id
                ? `produto.html?id=${encodeURIComponent(item.id)}`
                : "catalogo.html"
              }"
            >

              <h2 class="item-name">
                ${nome}
              </h2>

            </a>

            <div class="item-size">
              TAMANHO: ${tamanho}
            </div>

            <span class="item-price">
              ${dinheiro(subtotal)}
            </span>

          </div>

          <div class="item-controls">

            <div class="quantity">

              <button
                type="button"
                onclick="alterarQuantidade(${index},-1)"
                aria-label="Diminuir quantidade"
              >
                −
              </button>

              <span>
                ${quantidade}
              </span>

              <button
                type="button"
                onclick="alterarQuantidade(${index},1)"
                aria-label="Aumentar quantidade"
              >
                +
              </button>

            </div>

            <button
              type="button"
              class="remove"
              onclick="removerItem(${index})"
            >
              REMOVER ×
            </button>

          </div>

        </div>

      `;

    }).join("");

  container.innerHTML = `

    <div class="cart-layout">

      <section class="cart-items">
        ${itensHTML}
      </section>

      <aside class="summary">

        <div class="summary-label">
          ANARKA / RESUMO
        </div>

        <h2>
          Pedido
        </h2>

        <div class="summary-line">

          <span>
            Produtos (${quantidadeTotal})
          </span>

          <strong>
            ${dinheiro(total)}
          </strong>

        </div>

        <div class="summary-line">

          <span>
            Frete
          </span>

          <strong>
            Calculado no checkout
          </strong>

        </div>

        <div class="summary-total">

          <span>
            Total
          </span>

          <strong>
            ${dinheiro(total)}
          </strong>

        </div>

        <a
          href="checkout.html"
          class="checkout"
        >
          FINALIZAR PEDIDO →
        </a>

        <a
          href="catalogo.html"
          class="continue"
        >
          ← CONTINUAR COMPRANDO
        </a>

      </aside>

    </div>

  `;

}

/* ============================================
   ALTERAR QUANTIDADE
============================================ */

function alterarQuantidade(index,mudanca){

  const carrinho =
    pegarCarrinho();

  if(!carrinho[index]){
    return;
  }

  let quantidade =
    Number(
      carrinho[index].quantidade
    ) || 1;

  quantidade += mudanca;

  if(quantidade <= 0){

    carrinho.splice(index,1);

  }else{

    if(quantidade > 10){
      quantidade = 10;
    }

    carrinho[index].quantidade =
      quantidade;

  }

  salvarCarrinho(carrinho);

  renderizarCarrinho();

}

/* ============================================
   REMOVER
============================================ */

function removerItem(index){

  const carrinho =
    pegarCarrinho();

  carrinho.splice(index,1);

  salvarCarrinho(carrinho);

  renderizarCarrinho();

}

/* ============================================
   INICIAR
============================================ */

renderizarCarrinho();

window.addEventListener(
  "storage",
  renderizarCarrinho
);

</script>

</body>
</html>
