<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carrinho | VANTA</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f7f7;
color:#111;
}

header{
height:70px;
background:#000;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 6%;
}

.logo{
font-size:25px;
font-weight:bold;
letter-spacing:4px;
}

header a{
color:#fff;
text-decoration:none;
font-size:22px;
}

.container{
max-width:900px;
margin:40px auto;
padding:20px;
}

h1{
font-size:32px;
margin-bottom:30px;
}

.item{
background:#fff;
padding:20px;
border-radius:10px;
display:flex;
gap:20px;
align-items:center;
margin-bottom:20px;
}

.item img{
width:130px;
height:160px;
object-fit:cover;
border-radius:8px;
background:#eee;
}

.info{
flex:1;
}

.info h2{
margin:0 0 10px;
font-size:21px;
}

.price{
font-weight:bold;
font-size:20px;
}

.size{
color:#666;
margin:8px 0;
}

.controls{
display:flex;
align-items:center;
gap:10px;
margin-top:12px;
}

.controls button{
width:32px;
height:32px;
border:1px solid #ccc;
background:#fff;
font-size:18px;
cursor:pointer;
}

.remove{
margin-top:12px;
border:0;
background:none;
color:#c00;
cursor:pointer;
padding:0;
}

.total{
background:#fff;
padding:25px;
border-radius:10px;
text-align:right;
}

.total h2{
margin:0 0 20px;
}

.checkout{
display:block;
width:100%;
padding:17px;
background:#000;
color:#fff;
text-decoration:none;
text-align:center;
font-weight:bold;
border-radius:5px;
}

.empty{
background:#fff;
padding:50px 20px;
text-align:center;
border-radius:10px;
}

.empty a{
display:inline-block;
margin-top:20px;
background:#000;
color:#fff;
padding:15px 25px;
text-decoration:none;
}

@media(max-width:600px){

.item{
align-items:flex-start;
}

.item img{
width:100px;
height:130px;
}

.info h2{
font-size:18px;
}

.container{
padding:15px;
}

}
</style>
</head>

<body>

<header>
<div class="logo">VANTA</div>
<a href="index.html">←</a>
</header>

<div class="container">

<h1>Seu carrinho</h1>

<div id="carrinho"></div>

</div>

<script>

let produto=JSON.parse(localStorage.getItem("vantaCarrinho"));
let area=document.getElementById("carrinho");

function mostrar(){

if(!produto){

area.innerHTML=`
<div class="empty">
<h2>Seu carrinho está vazio</h2>
<p>Adicione algum produto da VANTA.</p>
<a href="index.html">VER PRODUTOS</a>
</div>`;

return;
}

let total=produto.preco*produto.quantidade;

area.innerHTML=`

<div class="item">

<img src="${produto.imagem || ''}">

<div class="info">

<h2>${produto.nome}</h2>

<div class="price">
R$ ${produto.preco.toFixed(2).replace(".",",")}
</div>

<div class="size">
Tamanho: ${produto.tamanho}
</div>

<div class="controls">

<button onclick="alterar(-1)">−</button>

<strong>${produto.quantidade}</strong>

<button onclick="alterar(1)">+</button>

</div>

<button class="remove" onclick="remover()">
Remover produto
</button>

</div>

</div>

<div class="total">

<h2>
Total: R$ ${total.toFixed(2).replace(".",",")}
</h2>

<a class="checkout" href="checkout.html">
FINALIZAR COMPRA
</a>

</div>

`;

}

function alterar(valor){

produto.quantidade+=valor;

if(produto.quantidade<1){
produto.quantidade=1;
}

localStorage.setItem(
"vantaCarrinho",
JSON.stringify(produto)
);

mostrar();

}

function remover(){

localStorage.removeItem("vantaCarrinho");

produto=null;

mostrar();

}

mostrar();

</script>

</body>
</html>
