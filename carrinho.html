<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrinho — VANTA</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#f5f5f5;
color:#111
}

header{
height:70px;
background:#0b0b0b;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 6%
}

.logo{
font-size:28px;
font-weight:900;
letter-spacing:3px
}

nav{
display:flex;
gap:20px
}

nav a{
color:#fff;
text-decoration:none;
font-size:14px
}

.container{
max-width:900px;
margin:50px auto;
padding:20px
}

h1{
font-size:32px;
margin-bottom:30px
}

.cart{
background:#fff;
padding:25px;
border-radius:12px
}

.item{
display:flex;
gap:20px;
align-items:center;
border-bottom:1px solid #ddd;
padding-bottom:25px;
margin-bottom:25px
}

.item img{
width:120px;
height:140px;
object-fit:cover;
border-radius:8px
}

.item-info{
flex:1
}

.item-info h2{
font-size:20px;
margin-bottom:10px
}

.price{
font-weight:bold;
font-size:20px
}

.quantity{
margin-top:12px;
color:#666
}

.total{
display:flex;
justify-content:space-between;
font-size:22px;
font-weight:bold;
margin-bottom:25px
}

.checkout{
display:block;
width:100%;
padding:18px;
background:#111;
color:#fff;
border:0;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer
}

.empty{
text-align:center;
padding:50px 10px;
color:#666
}

.back{
display:inline-block;
margin-bottom:20px;
color:#111;
text-decoration:none
}

@media(max-width:600px){
.item{
align-items:flex-start
}

.item img{
width:100px;
height:120px
}
}
</style>
</head>

<body>

<header>

<div class="logo">VANTA</div>

<nav>
<a href="index.html">PRODUTOS</a>
<a href="index.html#sobre">SOBRE</a>
</nav>

</header>

<div class="container">

<a href="index.html" class="back">← Continuar comprando</a>

<h1>SEU CARRINHO</h1>

<div class="cart" id="carrinho"></div>

</div>

<script>

let produto = JSON.parse(localStorage.getItem("vantaCarrinho"));

const carrinho = document.getElementById("carrinho");

if(!produto){

carrinho.innerHTML = `
<div class="empty">
<h2>Seu carrinho está vazio.</h2>
<p style="margin-top:10px">Escolha um produto para começar.</p>
</div>
`;

}else{

let total = produto.preco * produto.quantidade;

carrinho.innerHTML = `

<div class="item">

<img src="${produto.imagem || ''}">

<div class="item-info">

<h2>${produto.nome}</h2>

<div class="price">
R$ ${produto.preco.toFixed(2).replace('.',',')}
</div>

<div class="quantity">
Tamanho: ${produto.tamanho || 'M'}<br>
Quantidade: ${produto.quantidade}
</div>

</div>

</div>

<div class="total">

<span>Total</span>

<span>
R$ ${total.toFixed(2).replace('.',',')}
</span>

</div>

<a href="#" class="checkout" onclick="finalizar()">
CONTINUAR PARA PAGAMENTO
</a>

`;

}

function finalizar(){

alert("Checkout será configurado no próximo passo!");

}

</script>

</body>
</html>
