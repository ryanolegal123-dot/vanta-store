<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pagamento | VANTA</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#111;
}

header{
height:70px;
background:#000;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 6%;
}

.logo{
font-size:25px;
font-weight:bold;
letter-spacing:4px;
}

header a{
color:#fff;
text-decoration:none;
font-size:22px;
}

.container{
max-width:700px;
margin:40px auto;
padding:20px;
}

.box{
background:#fff;
padding:25px;
border-radius:10px;
margin-bottom:20px;
}

h1{
margin-top:0;
font-size:30px;
}

h2{
font-size:20px;
}

.metodo{
display:block;
border:2px solid #ddd;
padding:18px;
border-radius:8px;
margin:12px 0;
cursor:pointer;
transition:.2s;
}

.metodo:hover{
border-color:#000;
}

.metodo input{
margin-right:10px;
}

.metodo.ativo{
border-color:#000;
background:#fafafa;
}

.resumo{
border-top:1px solid #ddd;
margin-top:20px;
padding-top:20px;
}

.total{
font-size:25px;
font-weight:bold;
margin:20px 0;
}

.pagar{
width:100%;
padding:17px;
background:#000;
color:#fff;
border:0;
border-radius:6px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.pix,
.cartao{
display:none;
background:#f5f5f5;
padding:20px;
margin-top:15px;
border-radius:8px;
text-align:center;
}

.pix strong,
.cartao strong{
font-size:18px;
}

@media(max-width:700px){

.container{
margin:20px auto;
padding:15px;
}

.box{
padding:20px;
}

h1{
font-size:26px;
}

}
</style>
</head>

<body>

<header>

<div class="logo">VANTA</div>

<a href="checkout.html">←</a>

</header>

<div class="container">

<div class="box">

<h1>Pagamento</h1>

<p>Escolha uma forma de pagamento:</p>

<label class="metodo" id="opcaoPix">

<input
type="radio"
name="pagamento"
value="pix"
onclick="selecionar('pix')">

<strong>PIX</strong>

<br>

Pagamento rápido e seguro

</label>

<div id="pix" class="pix">

<strong>PIX</strong>

<p>
O pagamento via PIX será gerado automaticamente
quando o sistema de pagamento estiver conectado.
</p>

</div>

<label class="metodo" id="opcaoCartao">

<input
type="radio"
name="pagamento"
value="cartao"
onclick="selecionar('cartao')">

<strong>CARTÃO</strong>

<br>

Crédito ou débito

</label>

<div id="cartao" class="cartao">

<strong>CARTÃO</strong>

<p>
Você será direcionado para o pagamento seguro
quando o gateway estiver conectado.
</p>

</div>

</div>

<div class="box">

<h2>Resumo do pedido</h2>

<div id="resumo"></div>

<button class="pagar" onclick="pagar()">
PAGAR PEDIDO
</button>

</div>

</div>

<script>

let produto=JSON.parse(
localStorage.getItem("vantaCarrinho")
);

let resumo=document.getElementById("resumo");

if(!produto){

resumo.innerHTML="<p>Carrinho vazio.</p>";

}else{

let total=
produto.preco*produto.quantidade;

resumo.innerHTML=`

<p><strong>${produto.nome}</strong></p>

<p>Tamanho: ${produto.tamanho}</p>

<p>Quantidade: ${produto.quantidade}</p>

<div class="total">
Total: R$ ${total.toFixed(2).replace(".",",")}
</div>

`;

}

let metodo="";

function selecionar(tipo){

metodo=tipo;

document.getElementById("pix").style.display="none";
document.getElementById("cartao").style.display="none";

document.getElementById("opcaoPix").classList.remove("ativo");
document.getElementById("opcaoCartao").classList.remove("ativo");

if(tipo==="pix"){

document.getElementById("pix").style.display="block";
document.getElementById("opcaoPix").classList.add("ativo");

}

if(tipo==="cartao"){

document.getElementById("cartao").style.display="block";
document.getElementById("opcaoCartao").classList.add("ativo");

}

}

function pagar(){

if(!metodo){

alert("Escolha uma forma de pagamento.");

return;

}

alert(
"Pagamento selecionado: "+
metodo.toUpperCase()+
"."
);

}

</script>

</body>
</html>
