<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pagamento | VANTA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0b0b;
  color:#fff;
}

header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #222;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:4px;
}

.container{
  max-width:600px;
  margin:40px auto;
  padding:20px;
}

h1{
  font-size:30px;
  margin-bottom:25px;
}

.box{
  background:#111;
  border:1px solid #222;
  border-radius:12px;
  padding:22px;
  margin-bottom:20px;
}

h2{
  font-size:18px;
  margin-bottom:18px;
}

.pedido{
  color:#bbb;
  line-height:1.8;
}

.item{
  padding:12px 0;
  border-bottom:1px solid #222;
}

.item:last-child{
  border-bottom:0;
}

.item strong{
  color:#fff;
}

.total{
  color:#fff;
  font-size:22px;
  font-weight:bold;
  margin-top:15px;
}

.metodos{
  display:grid;
  gap:12px;
}

.metodo{
  border:1px solid #333;
  background:#181818;
  padding:18px;
  border-radius:10px;
  cursor:pointer;
}

.metodo:hover{
  border-color:#777;
}

.metodo.selecionado{
  border-color:#fff;
  background:#222;
}

.metodo strong{
  display:block;
  font-size:17px;
  margin-bottom:5px;
}

.metodo span{
  color:#999;
  font-size:13px;
}

.info{
  margin-top:15px;
  padding:15px;
  background:#181818;
  border-radius:8px;
  color:#aaa;
  font-size:14px;
  line-height:1.5;
}

button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:8px;
  background:#fff;
  color:#000;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  background:#ddd;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}
</style>
</head>

<body>

<header>
  <div class="logo">VANTA</div>
</header>

<div class="container">

<h1>Pagamento</h1>

<div class="box">

<h2>Resumo</h2>

<div id="pedido" class="pedido">
  Carregando...
</div>

</div>

<div class="box">

<h2>Forma de pagamento</h2>

<div class="metodos">

<div
  class="metodo"
  id="pix"
  onclick="selecionar('PIX')"
>
  <strong>PIX</strong>
  <span>Pagamento instantâneo</span>
</div>

<div
  class="metodo"
  id="cartao"
  onclick="selecionar('Cartão')"
>
  <strong>Cartão</strong>
  <span>Crédito ou débito</span>
</div>

</div>

<div id="info" class="info">
  Escolha uma forma de pagamento.
</div>

</div>

<button id="botao" onclick="pagar()">
  PAGAR PEDIDO
</button>

</div>

<script>

const SUPABASE_URL =
  "https://pzqgsbxuhsesfxhmgfbi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_bLqHB2EcCBMkhw4JLtH71A_xGOK0Pxh";

let pedido =
  JSON.parse(
    localStorage.getItem("vantaCheckout")
  );

let metodoSelecionado = "";

const area =
  document.getElementById("pedido");

if(!pedido){

  area.innerHTML =
    "Nenhum pedido encontrado.";

}else{

  let html = "";

  if(Array.isArray(pedido.itens)){

    pedido.itens.forEach(item => {

      const preco =
        Number(item.preco) || 0;

      const quantidade =
        Number(item.quantidade) || 1;

      const subtotal =
        preco * quantidade;

      html += `
        <div class="item">
          <strong>
            ${item.nome || "Produto"}
          </strong><br>

          Tamanho:
          ${item.tamanho || "Único"}<br>

          Quantidade:
          ${quantidade}<br>

          Subtotal:
          R$ ${subtotal.toFixed(2).replace(".",",")}
        </div>
      `;

    });

  }

  html += `
    <div>
      Cliente: ${pedido.nome}
    </div>

    <div class="total">
      Total: R$
      ${Number(pedido.total)
        .toFixed(2)
        .replace(".",",")}
    </div>
  `;

  area.innerHTML = html;
}

function selecionar(metodo){

  metodoSelecionado = metodo;

  document.getElementById("pix")
    .classList.remove("selecionado");

  document.getElementById("cartao")
    .classList.remove("selecionado");

  if(metodo === "PIX"){

    document.getElementById("pix")
      .classList.add("selecionado");

    document.getElementById("info").innerHTML =
      "Você será direcionado para o pagamento PIX.";

  }

  if(metodo === "Cartão"){

    document.getElementById("cartao")
      .classList.add("selecionado");

    document.getElementById("info").innerHTML =
      "Você será direcionado para o pagamento com cartão.";

  }
}

async function pagar(){

  if(!pedido){

    alert("Nenhum pedido encontrado.");
    return;

  }

  if(!metodoSelecionado){

    alert("Escolha uma forma de pagamento.");
    return;

  }

  const botao =
    document.getElementById("botao");

  botao.disabled = true;
  botao.innerText = "REGISTRANDO PEDIDO...";

  try{

    /*
      AGORA SIM o pedido é criado no Supabase.

      Isso acontece SOMENTE depois que
      o cliente escolheu a forma de pagamento.
    */

    const resposta =
      await fetch(
        `${SUPABASE_URL}/rest/v1/pedidos`,
        {
          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              `Bearer ${SUPABASE_KEY}`,
            "Content-Type":
              "application/json",
            "Prefer":
              "return=representation"
          },

          body:JSON.stringify({

            nome_cliente:
              pedido.nome,

            telefone:
              pedido.whatsapp,

            cpf:
              pedido.cpf,

            endereco:
              pedido.endereco,

            cidade:
              pedido.cidade,

            estado:
              pedido.estado,

            cep:
              pedido.cep,

            itens:
              pedido.itens,

            total:
              Number(pedido.total),

            forma_pagamento:
              metodoSelecionado,

            status:
              "Pagamento iniciado"

          })
        }
      );

    const dados =
      await resposta.json();

    if(!resposta.ok){

      console.error(
        "Erro Supabase:",
        dados
      );

      throw new Error(
        dados.message ||
        dados.error_description ||
        "Erro ao registrar pedido."
      );

    }

    const pedidoCriado =
      Array.isArray(dados)
        ? dados[0]
        : dados;

    /*
      Guardamos também uma cópia local
      para a página de pedidos.
    */

    const pedidoLocal = {

      id:
        pedidoCriado?.id || null,

      numero_pedido:
        pedidoCriado?.numero_pedido || null,

      nome:
        pedido.nome,

      whatsapp:
        pedido.whatsapp,

      cpf:
        pedido.cpf,

      endereco:
        pedido.endereco,

      cidade:
        pedido.cidade,

      estado:
        pedido.estado,

      cep:
        pedido.cep,

      itens:
        pedido.itens,

      total:
        Number(pedido.total),

      pagamento:
        metodoSelecionado,

      status:
        "Pagamento iniciado",

      data:
        new Date().toISOString()

    };

    let pedidos =
      JSON.parse(
        localStorage.getItem("vantaPedidos")
      ) || [];

    pedidos.push(pedidoLocal);

    localStorage.setItem(
      "vantaPedidos",
      JSON.stringify(pedidos)
    );

    /*
      Limpa os dados temporários.
    */

    localStorage.removeItem("vantaCheckout");
    localStorage.removeItem("vantaCarrinho");

    alert(
      "Pedido registrado com sucesso!"
    );

    window.location.href =
      "pedidos.html";

  }catch(erro){

    console.error(erro);

    alert(
      "Não foi possível registrar o pedido.\n\n" +
      "Tente novamente."
    );

    botao.disabled = false;
    botao.innerText = "PAGAR PEDIDO";

  }

}

</script>

</body>
</html>
