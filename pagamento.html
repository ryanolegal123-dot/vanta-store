<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pagamento | VANTA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0b0b;
  color:#fff;
}

header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #222;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:4px;
}

.container{
  max-width:600px;
  margin:40px auto;
  padding:20px;
}

h1{
  font-size:30px;
  margin-bottom:25px;
}

.box{
  background:#111;
  border:1px solid #222;
  border-radius:12px;
  padding:22px;
  margin-bottom:20px;
}

h2{
  font-size:18px;
  margin-bottom:18px;
}

.pedido{
  color:#bbb;
  line-height:1.8;
}

.total{
  color:#fff;
  font-size:22px;
  font-weight:bold;
  margin-top:10px;
}

.metodos{
  display:grid;
  gap:12px;
}

.metodo{
  border:1px solid #333;
  background:#181818;
  padding:18px;
  border-radius:10px;
  cursor:pointer;
}

.metodo:hover{
  border-color:#777;
}

.metodo.selecionado{
  border-color:#fff;
  background:#222;
}

.metodo strong{
  display:block;
  font-size:17px;
  margin-bottom:5px;
}

.metodo span{
  color:#999;
  font-size:13px;
}

.info{
  margin-top:15px;
  padding:15px;
  background:#181818;
  border-radius:8px;
  color:#aaa;
  font-size:14px;
  line-height:1.5;
}

button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:8px;
  background:#fff;
  color:#000;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  background:#ddd;
}
</style>
</head>

<body>

<header>
  <div class="logo">VANTA</div>
</header>

<div class="container">

<h1>Pagamento</h1>

<div class="box">

<h2>Resumo</h2>

<div id="pedido" class="pedido">
Carregando...
</div>

</div>

<div class="box">

<h2>Forma de pagamento</h2>

<div class="metodos">

<div class="metodo" id="pix" onclick="selecionar('PIX')">
<strong>PIX</strong>
<span>Pagamento instantâneo</span>
</div>

<div class="metodo" id="cartao" onclick="selecionar('Cartão')">
<strong>Cartão</strong>
<span>Crédito ou débito</span>
</div>

</div>

<div id="info" class="info">
Escolha uma forma de pagamento.
</div>

</div>

<button onclick="pagar()">
PAGAR PEDIDO
</button>

</div>

<script>

let pedido = JSON.parse(
  localStorage.getItem("vantaPedidoAtual")
);

let metodoSelecionado = "";

let area = document.getElementById("pedido");

if(!pedido){

  area.innerHTML = "Nenhum pedido encontrado.";

}else{

  area.innerHTML = `
    <div><strong>${pedido.produto}</strong></div>
    <div>Tamanho: ${pedido.tamanho}</div>
    <div>Quantidade: ${pedido.quantidade}</div>
    <div>Cliente: ${pedido.nome}</div>
    <div class="total">
      Total: R$ ${pedido.total.toFixed(2).replace(".",",")}
    </div>
  `;
}

function selecionar(metodo){

  metodoSelecionado = metodo;

  document.getElementById("pix")
    .classList.remove("selecionado");

  document.getElementById("cartao")
    .classList.remove("selecionado");

  if(metodo === "PIX"){

    document.getElementById("pix")
      .classList.add("selecionado");

    document.getElementById("info").innerHTML =
      "Você será direcionado para o pagamento PIX.";

  }

  if(metodo === "Cartão"){

    document.getElementById("cartao")
      .classList.add("selecionado");

    document.getElementById("info").innerHTML =
      "Você será direcionado para o pagamento com cartão.";

  }
}

function pagar(){

  if(!pedido){

    alert("Nenhum pedido encontrado.");
    return;

  }

  if(!metodoSelecionado){

    alert("Escolha uma forma de pagamento.");
    return;

  }

  pedido.pagamento = metodoSelecionado;
  pedido.status = "Pagamento iniciado";

  let pedidos =
    JSON.parse(localStorage.getItem("vantaPedidos")) || [];

  pedidos.push(pedido);

  localStorage.setItem(
    "vantaPedidos",
    JSON.stringify(pedidos)
  );

  localStorage.removeItem("vantaPedidoAtual");
  localStorage.removeItem("vantaCarrinho");

  alert(
    "Pedido registrado! O pagamento será conectado em breve."
  );

  window.location.href = "pedidos.html";
}

</script>

</body>
</html>
