<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pagamento | VANTA</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#111
}

header{
height:70px;
background:#000;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 6%
}

.logo{
font-size:25px;
font-weight:bold;
letter-spacing:4px
}

header a{
color:#fff;
text-decoration:none;
font-size:22px
}

.container{
max-width:700px;
margin:40px auto;
padding:20px
}

.box{
background:#fff;
padding:25px;
border-radius:10px;
margin-bottom:20px
}

h1{
margin-top:0;
font-size:30px
}

.metodo{
border:1px solid #ddd;
padding:18px;
border-radius:8px;
margin:12px 0;
cursor:pointer
}

.metodo:hover{
border-color:#000
}

.metodo input{
margin-right:10px
}

.resumo{
border-top:1px solid #ddd;
margin-top:20px;
padding-top:20px
}

.total{
font-size:25px;
font-weight:bold;
margin:20px 0
}

button{
width:100%;
padding:17px;
background:#000;
color:#fff;
border:0;
border-radius:5px;
font-size:16px;
font-weight:bold;
cursor:pointer
}

.pix{
display:none;
background:#f5f5f5;
padding:20px;
margin-top:15px;
border-radius:8px;
text-align:center
}

.pix strong{
font-size:18px
}
</style>
</head>

<body>

<header>

<div class="logo">VANTA</div>

<a href="checkout.html">←</a>

</header>

<div class="container">

<div class="box">

<h1>Pagamento</h1>

<p>Escolha uma forma de pagamento:</p>

<label class="metodo">
<input type="radio" name="pagamento" value="pix" onclick="mostrarPix()">
<strong>PIX</strong><br>
Pagamento rápido
</label>

<label class="metodo">
<input type="radio" name="pagamento" value="cartao" onclick="mostrarCartao()">
<strong>Cartão</strong><br>
Crédito ou débito
</label>

<div id="pix" class="pix">

<strong>PIX selecionado</strong>

<p>
O código PIX será gerado automaticamente
quando o pagamento real estiver conectado.
</p>

</div>

<div id="cartao" class="pix">

<strong>Cartão selecionado</strong>

<p>
Os dados do cartão serão preenchidos
na página segura do pagamento.
</p>

</div>

</div>

<div class="box">

<h2>Resumo</h2>

<div id="resumo"></div>

<button onclick="pagar()">
PAGAR PEDIDO
</button>

</div>

</div>

<script>

let produto=JSON.parse(localStorage.getItem("vantaCarrinho"));

let resumo=document.getElementById("resumo");

if(!produto){

resumo.innerHTML="<p>Carrinho vazio.</p>";

}else{

let total=produto.preco*produto.quantidade;

resumo.innerHTML=`

<p><strong>${produto.nome}</strong></p>

<p>Tamanho: ${produto.tamanho}</p>

<p>Quantidade: ${produto.quantidade}</p>

<div class="total">
Total: R$ ${total.toFixed(2).replace(".",",")}
</div>

`;

}

function mostrarPix(){

document.getElementById("pix").style.display="block";
document.getElementById("cartao").style.display="none";

}

function mostrarCartao(){

document.getElementById("cartao").style.display="block";
document.getElementById("pix").style.display="none";

}

function pagar(){

let selecionado=document.querySelector(
'input[name="pagamento"]:checked'
);

if(!selecionado){

alert("Escolha uma forma de pagamento.");

return;

}

alert(
"Forma de pagamento selecionada: "+
selecionado.value.toUpperCase()+
". Na próxima etapa vamos conectar o pagamento real."
);

}

</script>

</body>
</html>
