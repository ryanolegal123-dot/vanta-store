<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Catálogo | VANTA</title>

  <link rel="icon" href="data:image/svg+xml,...">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0a0a0a;
color:#fff;
}

header{
height:70px;
border-bottom:1px solid #222;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 6%;
position:sticky;
top:0;
background:rgba(10,10,10,.95);
backdrop-filter:blur(10px);
z-index:10;
}

.logo{
color:#fff;
text-decoration:none;
font-size:25px;
font-weight:900;
letter-spacing:5px;
}

nav{
display:flex;
gap:24px;
align-items:center;
}

nav a{
color:#aaa;
text-decoration:none;
font-size:13px;
}

nav a:hover{
color:#fff;
}

.cart{
color:#fff;
text-decoration:none;
border:1px solid #333;
padding:9px 13px;
border-radius:5px;
}

.cart span{
color:#999;
margin-left:4px;
}

.top{
padding:65px 6% 35px;
display:flex;
justify-content:space-between;
align-items:end;
gap:20px;
}

.top h1{
font-size:clamp(42px,9vw,82px);
line-height:.9;
letter-spacing:-4px;
}

.top p{
color:#777;
margin-top:18px;
font-size:14px;
}

.filter{
background:#111;
border:1px solid #333;
color:#fff;
padding:13px 15px;
border-radius:5px;
outline:none;
cursor:pointer;
}

.products{
padding:20px 6% 90px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:22px;
}

.product{
position:relative;
display:flex;
flex-direction:column;
}

.image{
width:100%;
aspect-ratio:4/5;
overflow:hidden;
background:#111;
margin-bottom:15px;
}

.image img{
width:100%;
height:100%;
object-fit:cover;
transition:.4s;
}

.product:hover img{
transform:scale(1.04);
}

.tag{
position:absolute;
top:12px;
left:12px;
background:#fff;
color:#000;
padding:6px 9px;
font-size:10px;
font-weight:bold;
letter-spacing:1px;
}

.product h2{
font-size:16px;
margin-bottom:7px;
min-height:19px;
}

.price{
display:flex;
gap:8px;
align-items:center;
min-height:20px;
}

.price strong{
font-size:17px;
}

.old{
color:#555;
text-decoration:line-through;
font-size:13px;
}

.button{
display:block;
width:100%;
margin-top:13px;
padding:13px;
background:#fff;
color:#000;
text-align:center;
text-decoration:none;
font-size:12px;
font-weight:bold;
letter-spacing:1px;
border-radius:4px;
}

.button:hover{
background:#ccc;
}

footer{
border-top:1px solid #222;
padding:35px 6%;
color:#555;
font-size:12px;
}


/* CARRINHO FLUTUANTE */

.carrinho-flutuante{
position:fixed;
right:20px;
bottom:20px;
width:58px;
height:58px;
border-radius:50%;
background:#fff;
color:#000;
display:none;
align-items:center;
justify-content:center;
font-size:24px;
text-decoration:none;
box-shadow:0 5px 25px rgba(0,0,0,.5);
z-index:100;
}

.carrinho-flutuante.ativo{
display:flex;
}

.contador{
position:absolute;
top:-5px;
right:-5px;
background:#000;
color:#fff;
width:22px;
height:22px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
font-weight:bold;
border:2px solid #fff;
}


@media(max-width:650px){

header{
padding:0 5%;
}

nav a:not(.cart){
display:none;
}

.top{
padding:50px 5% 25px;
display:block;
}

.top h1{
font-size:55px;
}

.filter{
margin-top:25px;
width:100%;
}

.products{
padding:15px 5% 70px;
gap:12px;
}

.product h2{
font-size:14px;
min-height:34px;
}

.price strong{
font-size:15px;
}

}

</style>

</head>


<body>


<header>

<a href="index.html" class="logo">
VANTA
</a>


<nav>

<a href="index.html">
Início
</a>

<a href="catalogo.html">
Catálogo
</a>

<a href="carrinho.html" class="cart">
Carrinho
<span id="cartCount">0</span>
</a>

</nav>

</header>


<section class="top">

<div>

<h1>CATÁLOGO</h1>

<p>
Peças essenciais para quem não passa despercebido.
</p>

</div>


<select id="sort" class="filter">

<option value="normal">
Ordenar produtos
</option>

<option value="menor">
Menor preço
</option>

<option value="maior">
Maior preço
</option>

</select>

</section>


<main
class="products"
id="products"
>
</main>


<a
href="carrinho.html"
id="carrinhoFlutuante"
class="carrinho-flutuante"
>

🛒

<span
id="contador"
class="contador"
>
0
</span>

</a>


<footer>

VANTA — Vista sua presença.

</footer>


<script>


/*
==================================================
CARREGA OS PRODUTOS DO produto.html
==================================================
*/

async function carregarProdutos(){

try{

const resposta =
await fetch("produto.html");


const texto =
await resposta.text();


const inicio =
texto.indexOf("const produtos = {");


const fim =
texto.indexOf("};",inicio);


if(inicio === -1 || fim === -1){

throw new Error(
"Cadastro de produtos não encontrado."
);

}


const trecho =
texto.substring(
inicio,
fim + 2
);


const codigo =
trecho
.replace(
"const produtos =",
"window.__produtos ="
);


const script =
document.createElement("script");


script.textContent =
codigo;


document.body.appendChild(script);


renderizarProdutos(
window.__produtos
);


}catch(erro){

console.error(erro);

document.getElementById("products")
.innerHTML =
"<p>Não foi possível carregar os produtos.</p>";

}

}


/*
==================================================
MONTA O CATÁLOGO
==================================================
*/

function renderizarProdutos(produtos){

const container =
document.getElementById("products");


container.innerHTML = "";


Object.entries(produtos)
.forEach(([id,produto]) => {


const article =
document.createElement("article");

article.className =
"product";

article.dataset.price =
produto.preco;


article.innerHTML = `

<div class="image">

<span class="tag">
${produto.tag || "VANTA"}
</span>

<img
src="${produto.imagem}"
alt="${produto.nome}"
>

</div>


<h2>
${produto.nome}
</h2>


<div class="price">

<strong>
R$ ${produto.preco
.toFixed(2)
.replace(".",",")}
</strong>


${
produto.antigo
?
`<span class="old">
R$ ${produto.antigo
.toFixed(2)
.replace(".",",")}
</span>`
:
""
}

</div>


<a
href="produto.html?id=${id}"
class="button"
>
VER PRODUTO
</a>

`;


container.appendChild(article);

});

}


/*
==================================================
ORDENAÇÃO
==================================================
*/

document.getElementById("sort")
.addEventListener("change",function(){

const container =
document.getElementById("products");

const produtos =
Array.from(
container.querySelectorAll(".product")
);


if(this.value === "menor"){

produtos.sort(
(a,b) =>
Number(a.dataset.price) -
Number(b.dataset.price)
);

}


if(this.value === "maior"){

produtos.sort(
(a,b) =>
Number(b.dataset.price) -
Number(a.dataset.price)
);

}


produtos.forEach(produto =>
container.appendChild(produto)
);

});


/*
==================================================
CARRINHO
==================================================
*/

function atualizarCarrinho(){

let carrinho =
JSON.parse(
localStorage.getItem("vantaCarrinho")
) || [];


if(!Array.isArray(carrinho)){
carrinho=[];
}


const total =
carrinho.reduce(
(soma,item) =>
soma + (Number(item.quantidade) || 0),
0
);


document.getElementById("cartCount")
.textContent = total;


document.getElementById("contador")
.textContent = total;


const botao =
document.getElementById(
"carrinhoFlutuante"
);


if(total > 0){

botao.classList.add("ativo");

}else{

botao.classList.remove("ativo");

}

}


/*
==================================================
INICIALIZA
==================================================
*/

carregarProdutos();

atualizarCarrinho();

</script>


</body>

</html>
