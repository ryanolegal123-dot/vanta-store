<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VANTA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
}

header{
height:70px;
border-bottom:1px solid #222;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
}

.logo{
font-size:26px;
font-weight:900;
letter-spacing:4px;
color:#fff;
text-decoration:none;
}

.back{
color:#aaa;
text-decoration:none;
font-size:13px;
}

.container{
max-width:1000px;
margin:40px auto;
padding:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

.produto-img{
width:100%;
border-radius:12px;
display:block;
}

h1{
font-size:32px;
margin-bottom:15px;
}

.preco{
font-size:25px;
font-weight:bold;
margin:15px 0;
}

.antigo{
color:#777;
text-decoration:line-through;
font-size:16px;
}

.parcela{
color:#aaa;
margin-bottom:25px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

select,
input{
width:100%;
padding:14px;
background:#181818;
border:1px solid #333;
color:#fff;
border-radius:8px;
margin-bottom:18px;
}

button{
width:100%;
padding:17px;
border:0;
border-radius:8px;
background:#fff;
color:#000;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#ddd;
}

.carrinho-flutuante{
position:fixed;
right:20px;
bottom:20px;
width:58px;
height:58px;
border-radius:50%;
background:#fff;
color:#000;
display:none;
align-items:center;
justify-content:center;
font-size:24px;
text-decoration:none;
box-shadow:0 5px 25px rgba(0,0,0,.5);
z-index:100;
}

.carrinho-flutuante.ativo{
display:flex;
}

.contador{
position:absolute;
top:-5px;
right:-5px;
background:#000;
color:#fff;
width:22px;
height:22px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
font-weight:bold;
border:2px solid #fff;
}

@media(max-width:700px){

.container{
grid-template-columns:1fr;
margin:20px auto;
padding:15px;
gap:25px;
}

h1{
font-size:27px;
}

}

</style>

</head>

<body>

<header>

<a href="index.html" class="logo">VANTA</a>

<a href="catalogo.html" class="back">← Catálogo</a>

</header>


<div class="container">

<div>

<img
id="produtoImagem"
class="produto-img"
src=""
alt="Produto VANTA"
>

</div>


<div>

<h1 id="produtoNome"></h1>

<div id="produtoAntigo" class="antigo"></div>

<div id="produtoPreco" class="preco"></div>

<div id="produtoParcela" class="parcela"></div>


<label for="tamanho">
Tamanho
</label>

<select id="tamanho">

<option value="P">P</option>
<option value="M" selected>M</option>
<option value="G">G</option>
<option value="GG">GG</option>

</select>


<label for="quantidade">
Quantidade
</label>

<input
id="quantidade"
type="number"
value="1"
min="1"
>


<button onclick="adicionarCarrinho()">
ADICIONAR AO CARRINHO
</button>

</div>

</div>


<a
href="carrinho.html"
id="carrinhoFlutuante"
class="carrinho-flutuante"
>

🛒

<span id="contador" class="contador">
0
</span>

</a>

/* ==================================================
   PRODUTO ATUAL
================================================== */

const parametros =
new URLSearchParams(window.location.search);

const id =
parametros.get("id") || "oversized";

const produto =
produtos[id] || produtos.oversized;


document.title =
produto.nome + " | VANTA";


document.getElementById("produtoNome")
.textContent = produto.nome;


document.getElementById("produtoImagem")
.src = produto.imagem;


document.getElementById("produtoImagem")
.alt = produto.nome;


document.getElementById("produtoPreco")
.textContent =
"R$ " +
produto.preco
.toFixed(2)
.replace(".",",");


if(produto.antigo){

document.getElementById("produtoAntigo")
.textContent =
"R$ " +
produto.antigo
.toFixed(2)
.replace(".",",");

}else{

document.getElementById("produtoAntigo")
.style.display="none";

}


const parcela =
produto.preco / 3;


document.getElementById("produtoParcela")
.textContent =
"ou 3x de R$ " +
parcela
.toFixed(2)
.replace(".",",");


/* ==================================================
   CARRINHO
================================================== */

function pegarCarrinho(){

let carrinho =
JSON.parse(
localStorage.getItem("vantaCarrinho")
) || [];

if(!Array.isArray(carrinho)){
carrinho=[];
}

return carrinho;

}


function atualizarCarrinho(){

const carrinho =
pegarCarrinho();


const total =
carrinho.reduce(
(soma,item) =>
soma + (Number(item.quantidade) || 0),
0
);


document.getElementById("contador")
.textContent = total;


const botao =
document.getElementById("carrinhoFlutuante");


if(total > 0){

botao.classList.add("ativo");

}else{

botao.classList.remove("ativo");

}

}


function adicionarCarrinho(){

let carrinho =
pegarCarrinho();


const tamanho =
document.getElementById("tamanho")
.value;


const quantidade =
Math.max(
1,
Number(
document.getElementById("quantidade").value
) || 1
);


const produtoExistente =
carrinho.find(item =>
item.nome === produto.nome &&
item.tamanho === tamanho
);


if(produtoExistente){

produtoExistente.quantidade += quantidade;

}else{

carrinho.push({

nome:produto.nome,

preco:produto.preco,

tamanho:tamanho,

quantidade:quantidade,

imagem:produto.imagem

});

}


localStorage.setItem(
"vantaCarrinho",
JSON.stringify(carrinho)
);


window.location.href =
"catalogo.html";

}


atualizarCarrinho();

</script>
