<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="/favicon.png">

<title>Produto | VANTA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#080808;
color:#fff;
}

/* HEADER */

header{
height:70px;
padding:0 6%;

display:flex;
align-items:center;
justify-content:space-between;

border-bottom:1px solid #222;

position:sticky;
top:0;

background:rgba(8,8,8,.94);
backdrop-filter:blur(12px);

z-index:10;
}

.logo{
color:#fff;
text-decoration:none;

font-size:25px;
font-weight:900;
letter-spacing:5px;
}

nav{
display:flex;
align-items:center;
gap:24px;
}

nav a{
color:#999;
text-decoration:none;
font-size:13px;
}

nav a:hover{
color:#fff;
}

.cart{
color:#fff;
border:1px solid #333;
padding:9px 13px;
border-radius:5px;
}

/* PRODUTO */

.product-page{

width:100%;
max-width:1250px;

margin:0 auto;

padding:70px 40px 100px;

display:grid;

grid-template-columns:
1fr 1fr;

gap:70px;

}

/* FOTO */

.product-image{

position:relative;

width:100%;

aspect-ratio:4/5;

background:#111;

overflow:hidden;
}

.product-image img{

width:100%;
height:100%;

object-fit:cover;

display:block;

}

/* TAG */

.tag{

position:absolute;

top:18px;
left:18px;

background:#fff;
color:#000;

padding:8px 12px;

font-size:10px;

font-weight:bold;

letter-spacing:1px;

z-index:2;
}

/* INFORMAÇÕES */

.product-info{

display:flex;

flex-direction:column;

justify-content:center;

}

.product-info h1{

font-size:
clamp(40px,5vw,68px);

line-height:.9;

letter-spacing:-3px;

margin-bottom:20px;
}

.old-price{

color:#555;

text-decoration:line-through;

font-size:14px;

margin-bottom:5px;
}

.price{

font-size:25px;

font-weight:bold;

}

.installment{

color:#777;

font-size:12px;

margin-top:7px;

margin-bottom:30px;
}

/* TAMANHOS */

.label{

font-size:11px;

letter-spacing:1px;

margin-bottom:10px;

color:#aaa;
}

.sizes{

display:flex;

gap:8px;

margin-bottom:25px;
}

.size{

width:48px;
height:42px;

background:#111;

border:1px solid #333;

color:#fff;

cursor:pointer;
}

.size.active{

background:#fff;
color:#000;

border-color:#fff;
}

/* QUANTIDADE */

.quantity{

display:flex;

align-items:center;

gap:12px;

margin-bottom:25px;
}

.quantity input{

width:65px;

background:#111;

border:1px solid #333;

color:#fff;

padding:12px;

text-align:center;

font-size:14px;
}

/* BOTÃO */

.add{

width:100%;

padding:17px;

border:0;

background:#fff;

color:#000;

font-size:11px;

font-weight:bold;

letter-spacing:1px;

cursor:pointer;

transition:.2s;
}

.add:hover{

background:#ccc;

}

/* VOLTAR */

.back{

display:inline-block;

margin-top:18px;

color:#777;

font-size:12px;

text-decoration:none;
}

.back:hover{
color:#fff;
}

/* CARRINHO FLUTUANTE */

.carrinho-flutuante{

position:fixed;

right:22px;
bottom:22px;

width:58px;
height:58px;

border-radius:50%;

background:#fff;
color:#000;

display:none;

align-items:center;
justify-content:center;

font-size:24px;

text-decoration:none;

box-shadow:0 5px 25px rgba(0,0,0,.5);

z-index:100;
}

.carrinho-flutuante.ativo{
display:flex;
}

.contador{

position:absolute;

top:-5px;
right:-5px;

width:22px;
height:22px;

border-radius:50%;

background:#000;
color:#fff;

border:2px solid #fff;

display:flex;
align-items:center;
justify-content:center;

font-size:10px;
font-weight:bold;
}

/* MOBILE */

@media(max-width:800px){

header{
padding:0 5%;
}

nav a:not(.cart){
display:none;
}

.product-page{

grid-template-columns:1fr;

padding:35px 5% 80px;

gap:40px;

}

.product-image{

aspect-ratio:4/5;

}

.product-info h1{

font-size:48px;

}

}

/* CELULAR PEQUENO */

@media(max-width:400px){

.product-info h1{

font-size:42px;

}

}

</style>

</head>


<body>


<header>

<a
href="index.html"
class="logo"
>
VANTA
</a>


<nav>

<a href="index.html">
Início
</a>

<a href="catalogo.html">
Catálogo
</a>

<a
href="carrinho.html"
class="cart"
>
Carrinho
<span id="cartCount">0</span>
</a>

</nav>

</header>


<main
class="product-page"
id="productPage"
>

<div class="product-image">

<span
class="tag"
id="productTag"
>
VANTA
</span>

<img
id="productImage"
src=""
alt=""
>

</div>


<div class="product-info">

<h1 id="productName">
Produto
</h1>


<div
class="old-price"
id="oldPrice"
>
</div>


<div
class="price"
id="price"
>
</div>


<div
class="installment"
id="installment"
>
</div>


<div class="label">
TAMANHO
</div>


<div class="sizes">

<button
class="size"
data-size="P"
>
P
</button>

<button
class="size active"
data-size="M"
>
M
</button>

<button
class="size"
data-size="G"
>
G
</button>

<button
class="size"
data-size="GG"
>
GG
</button>

</div>


<div class="label">
QUANTIDADE
</div>


<div class="quantity">

<input
id="quantity"
type="number"
min="1"
value="1"
>

</div>


<button
class="add"
id="addButton"
>
ADICIONAR AO CARRINHO
</button>


<a
href="catalogo.html"
class="back"
>
← Voltar para o catálogo
</a>

</div>

</main>


<a
href="carrinho.html"
id="carrinhoFlutuante"
class="carrinho-flutuante"
>

🛒

<span
id="contador"
class="contador"
>
0
</span>

</a>


<script>

/*

==================================================
*/

const produtos = {

},

basicgray:{

},

cargoolive:{

tag:"DENIM"
},

joggerblack:{

preco:119.90,
antigo:149.90,
imagem:"https://images.unsplash.com/photo-1552902865-b72c031ac5ea?auto=format&fit=crop&w=1000&q=90",
tag:"ESSENTIAL"
},

joggergray:{
nome:"Jogger Urban Gray",
preco:119.90,

imagem:"https://images.unsplash.com/photo-1584865288642-42078afe6942?auto=format&fit=crop&w=1000&q=90",

},

},

},

},

jaqueta:{

tag:"JACKET"
},

camisa:{
nome:"Overshirt Utility Black",
preco:139.90,

tag:"UTILITY"
},

nome:"Regata Street Black",

imagem:"https://www.rokit.co.uk/cdn/shop/files/MECT-S46177V_1.jpg?v=1688525323",
tag:"STREET"
},

boneblack:{
nome:"VANTA Cap Black",
preco:49.90,
antigo:69.90,
imagem:"https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=1000&q=90",
tag:"ACCESSORY"
},

bermuda:{
nome:"Bermuda Cargo Black",
preco:89.90,
antigo:109.90,
imagem:"https://images.unsplash.com/photo-1565084888279-aca607ecce0c?auto=format&fit=crop&w=1000&q=90",
tag:"SUMMER"
}

};


/*
==================================================
IDENTIFICA O PRODUTO
==================================================
*/

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get("id") || "oversized";

const produto =
produtos[id] || produtos.oversized;


/*
==================================================
PREENCHER PÁGINA
==================================================
*/

document.getElementById(
"productName"
).textContent =
produto.nome;


document.getElementById(
"productImage"
).src =
produto.imagem;


document.getElementById(
"productImage"
).alt =
produto.nome;


document.getElementById(
"productTag"
).textContent =
produto.tag;


document.getElementById(
"oldPrice"
).textContent =
"R$ " +
produto.antigo
.toFixed(2)
.replace(".",",");


document.getElementById(
"price"
).textContent =
"R$ " +
produto.preco
.toFixed(2)
.replace(".",",");


document.getElementById(
"installment"
).textContent =
"ou 3x de R$ " +
(produto.preco / 3)
.toFixed(2)
.replace(".",",") +
" sem juros";


document.title =
produto.nome +
" | VANTA";


/*
==================================================
TAMANHOS
==================================================
*/

let tamanhoSelecionado = "M";

document
.querySelectorAll(".size")
.forEach(botao => {

botao.addEventListener(
"click",
() => {

document
.querySelectorAll(".size")
.forEach(b =>
b.classList.remove("active")
);

botao.classList.add("active");

tamanhoSelecionado =
botao.dataset.size;

}
);

});


/*
==================================================
CARRINHO
==================================================
*/

function atualizarCarrinho(){

let carrinho =
JSON.parse(
localStorage.getItem(
"vantaCarrinho"
)
) || [];


if(!Array.isArray(carrinho)){
carrinho=[];
}


const total =
carrinho.reduce(
(soma,item) =>
soma +
(Number(item.quantidade) || 0),
0
);


document.getElementById(
"cartCount"
).textContent =
total;


document.getElementById(
"contador"
).textContent =
total;


const botao =
document.getElementById(
"carrinhoFlutuante"
);


if(total > 0){

botao.classList.add(
"ativo"
);

}else{

botao.classList.remove(
"ativo"
);

}

}


/*
==================================================
ADICIONAR
==================================================
*/

document
.getElementById("addButton")
.addEventListener(
"click",
() => {

let carrinho =
JSON.parse(
localStorage.getItem(
"vantaCarrinho"
)
) || [];


if(!Array.isArray(carrinho)){
carrinho=[];
}


const quantidade =
Math.max(
1,
Number(
document.getElementById(
"quantity"
).value
) || 1
);


const existente =
carrinho.find(
item =>
item.id === id &&
item.tamanho === tamanhoSelecionado
);


if(existente){

existente.quantidade +=
quantidade;

}else{

carrinho.push({

id:id,

nome:produto.nome,

preco:produto.preco,

imagem:produto.imagem,

tamanho:tamanhoSelecionado,

quantidade:quantidade

});

}


localStorage.setItem(
"vantaCarrinho",
JSON.stringify(carrinho)
);


atualizarCarrinho();


/*
VOLTA PARA O CATÁLOGO
*/

window.location.href =
"catalogo.html";

});


/*
==================================================
INICIAR
==================================================
*/

atualizarCarrinho();

</script>

</body>

</html>
