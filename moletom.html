<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VANTA Essential Hoodie</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
color:#111
}
header{
height:70px;
background:#000;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 6%;
}
.logo{
font-size:25px;
font-weight:bold;
letter-spacing:4px;
}
header a{
color:#fff;
text-decoration:none;
font-size:22px;
}
.container{
max-width:1100px;
margin:50px auto;
padding:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:50px;
}
.product-img{
width:100%;
height:600px;
object-fit:cover;
border-radius:10px;
}
h1{
font-size:36px;
margin-bottom:10px;
}
.price{
font-size:28px;
font-weight:bold;
}
.old{
text-decoration:line-through;
color:#888;
font-size:17px;
margin-left:10px;
}
.installment{
color:#555;
margin:10px 0 25px;
}
.desc{
line-height:1.6;
color:#444;
}
.sizes{
display:flex;
gap:10px;
margin:25px 0;
}
.size{
border:1px solid #111;
background:#fff;
padding:12px 20px;
cursor:pointer;
}
.size.selected{
background:#000;
color:#fff;
}
.qty{
display:flex;
align-items:center;
gap:15px;
margin:20px 0;
}
.qty button{
width:35px;
height:35px;
border:1px solid #ccc;
background:#fff;
font-size:20px;
}
.add{
width:100%;
padding:17px;
background:#000;
color:#fff;
border:0;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
@media(max-width:700px){
.container{
grid-template-columns:1fr;
margin:20px auto;
gap:25px;
}
.product-img{
height:450px;
}
h1{
font-size:28px;
}
}
</style>
</head>

<body>

<header>
<div class="logo">VANTA</div>
<a href="carrinho.html">🛒</a>
</header>

<div class="container">

<div>
<img class="product-img"
src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=1000&q=90">
</div>

<div>

<h1>VANTA Essential Hoodie</h1>

<div>
<span class="price">R$ 149,90</span>
<span class="old">R$ 189,90</span>
</div>

<div class="installment">
ou 3x de R$ 49,97 sem juros
</div>

<p class="desc">
Moletom VANTA Essential com visual minimalista e urbano.
Confortável, versátil e feito para completar qualquer estilo.
</p>

<h3>Tamanho</h3>

<div class="sizes">
<button class="size" onclick="selecionar(this)">P</button>
<button class="size selected" onclick="selecionar(this)">M</button>
<button class="size" onclick="selecionar(this)">G</button>
<button class="size" onclick="selecionar(this)">GG</button>
</div>

<div class="qty">
<button onclick="alterar(-1)">−</button>
<span id="qtd">1</span>
<button onclick="alterar(1)">+</button>
</div>

<button class="add" onclick="adicionar()">
ADICIONAR AO CARRINHO
</button>

</div>
</div>

<script>

let tamanho="M";
let qtd=1;

function selecionar(botao){
document.querySelectorAll(".size").forEach(b=>b.classList.remove("selected"));
botao.classList.add("selected");
tamanho=botao.innerText;
}

function alterar(valor){
qtd+=valor;
if(qtd<1) qtd=1;
document.getElementById("qtd").innerText=qtd;
}

function adicionar(){

let produto={
nome:"VANTA Essential Hoodie",
preco:149.90,
tamanho:tamanho,
quantidade:qtd,
imagem:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=1000&q=90"
};

localStorage.setItem("vantaCarrinho",JSON.stringify(produto));

window.location.href="carrinho.html";

}

</script>

</body>
</html>
