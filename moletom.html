<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VANTA Essential Hoodie</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0b0b;
  color:#fff;
}

header{
  height:70px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:4px;
}

.cart{
  color:#fff;
  text-decoration:none;
}

.container{
  max-width:1000px;
  margin:40px auto;
  padding:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}

.produto-img{
  width:100%;
  border-radius:12px;
}

h1{
  font-size:32px;
  margin-bottom:15px;
}

.preco{
  font-size:25px;
  font-weight:bold;
  margin:15px 0;
}

.antigo{
  color:#777;
  text-decoration:line-through;
  font-size:16px;
}

.parcela{
  color:#aaa;
  margin-bottom:25px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

select,input{
  width:100%;
  padding:14px;
  background:#181818;
  border:1px solid #333;
  color:#fff;
  border-radius:8px;
  margin-bottom:18px;
}

button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:8px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#ddd;
}

@media(max-width:700px){
  .container{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

<div class="logo">VANTA</div>

<a href="carrinho.html" class="cart">
🛒 Carrinho
</a>

</header>

<div class="container">

<div>

<img
class="produto-img"
src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=1000&q=90"
alt="VANTA Essential Hoodie">

</div>

<div>

<h1>VANTA Essential Hoodie</h1>

<div class="antigo">
R$ 189,90
</div>

<div class="preco">
R$ 149,90
</div>

<div class="parcela">
ou 3x de R$ 49,97
</div>

<label for="tamanho">
Tamanho
</label>

<select id="tamanho">

<option value="P">
P
</option>

<option value="M" selected>
M
</option>

<option value="G">
G
</option>

<option value="GG">
GG
</option>

</select>

<label for="quantidade">
Quantidade
</label>

<input
id="quantidade"
type="number"
value="1"
min="1">

<button onclick="adicionarCarrinho()">
ADICIONAR AO CARRINHO
</button>

</div>

</div>

<script>

function adicionarCarrinho(){

  let carrinho =
    JSON.parse(localStorage.getItem("vantaCarrinho")) || [];

  if(!Array.isArray(carrinho)){
    carrinho = [carrinho];
  }

  let tamanho =
    document.getElementById("tamanho").value;

  let quantidade =
    Number(document.getElementById("quantidade").value);

  let produtoExistente = carrinho.find(p =>
    p.nome === "VANTA Essential Hoodie" &&
    p.tamanho === tamanho
  );

  if(produtoExistente){

    produtoExistente.quantidade += quantidade;

  }else{

    carrinho.push({

      nome:"VANTA Essential Hoodie",

      preco:149.90,

      tamanho:tamanho,

      quantidade:quantidade,

      imagem:
      "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=1000&q=90"

    });

  }

  localStorage.setItem(
    "vantaCarrinho",
    JSON.stringify(carrinho)
  );

  window.location.href="carrinho.html";

}

</script>

</body>
</html>
