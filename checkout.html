<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Checkout | VANTA</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#111
}

header{
height:70px;
background:#000;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 6%
}

.logo{
font-size:25px;
font-weight:bold;
letter-spacing:4px
}

header a{
color:#fff;
text-decoration:none;
font-size:22px
}

.container{
max-width:1000px;
margin:40px auto;
padding:20px;
display:grid;
grid-template-columns:1.5fr 1fr;
gap:25px
}

.box{
background:#fff;
padding:25px;
border-radius:10px
}

h1{
font-size:30px;
margin-top:0
}

h2{
font-size:20px
}

label{
display:block;
font-size:14px;
font-weight:bold;
margin-top:15px
}

input,select{
width:100%;
padding:14px;
margin-top:6px;
border:1px solid #ccc;
border-radius:5px;
font-size:15px
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.resumo{
border-bottom:1px solid #ddd;
padding-bottom:15px;
margin-bottom:15px
}

.total{
font-size:24px;
font-weight:bold;
margin:20px 0
}

button{
width:100%;
padding:17px;
background:#000;
color:#fff;
border:0;
font-weight:bold;
font-size:16px;
cursor:pointer;
border-radius:5px
}

.aviso{
font-size:13px;
color:#777;
margin-top:15px;
line-height:1.5
}

@media(max-width:700px){

.container{
grid-template-columns:1fr;
margin:20px auto
}

.row{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<header>
<div class="logo">VANTA</div>
<a href="carrinho.html">🛒</a>
</header>

<div class="container">

<div class="box">

<h1>Finalizar pedido</h1>

<h2>Seus dados</h2>

<label>Nome completo</label>
<input id="nome" type="text" placeholder="Digite seu nome">

<label>WhatsApp</label>
<input id="whatsapp" type="tel" placeholder="(00) 00000-0000">

<label>CPF</label>
<input id="cpf" type="text" placeholder="000.000.000-00">

<h2>Endereço</h2>

<label>CEP</label>
<input id="cep" type="text" placeholder="00000-000" maxlength="9" onblur="buscarCEP()">

<label>Rua</label>
<input id="rua" type="text" placeholder="Nome da rua">

<div class="row">

<div>
<label>Número</label>
<input id="numero" type="text" placeholder="123">
</div>

<div>
<label>Complemento</label>
<input id="complemento" type="text" placeholder="Opcional">
</div>

</div>

<div class="row">

<div>
<label>Cidade</label>
<input id="cidade" type="text" placeholder="Sua cidade">
</div>

<div>

<label>Estado</label>

<select id="estado">

<option value="">Selecione</option>
<option>AC</option>
<option>AL</option>
<option>AP</option>
<option>AM</option>
<option>BA</option>
<option>CE</option>
<option>DF</option>
<option>ES</option>
<option>GO</option>
<option>MA</option>
<option>MG</option>
<option>MS</option>
<option>MT</option>
<option>PA</option>
<option>PB</option>
<option>PE</option>
<option>PI</option>
<option>PR</option>
<option>RJ</option>
<option>RN</option>
<option>RO</option>
<option>RR</option>
<option>RS</option>
<option>SC</option>
<option>SE</option>
<option>SP</option>
<option>TO</option>

</select>

</div>

</div>

<br>

<button onclick="finalizar()">
CONTINUAR PARA PAGAMENTO
</button>

<p class="aviso">
Seus dados serão utilizados somente para processar o pedido e realizar a entrega.
</p>

</div>

<div class="box">

<h2>Resumo do pedido</h2>

<div id="resumo"></div>

</div>

</div>

<script>

let produto=JSON.parse(localStorage.getItem("vantaCarrinho"));

let resumo=document.getElementById("resumo");

if(!produto){

resumo.innerHTML="<p>Seu carrinho está vazio.</p>";

}else{

let total=produto.preco*produto.quantidade;

resumo.innerHTML=`

<div class="resumo">

<strong>${produto.nome}</strong>

<p>Tamanho: ${produto.tamanho}</p>

<p>Quantidade: ${produto.quantidade}</p>

</div>

<div class="total">
Total: R$ ${total.toFixed(2).replace(".",",")}
</div>

`;

}

async function buscarCEP(){

let cep=document.getElementById("cep").value.replace(/\D/g,"");

if(cep.length!==8)return;

try{

let resposta=await fetch("https://viacep.com.br/ws/"+cep+"/json/");

let dados=await resposta.json();

if(dados.erro){

alert("CEP não encontrado.");
return;

}

document.getElementById("rua").value=dados.logradouro || "";
document.getElementById("cidade").value=dados.localidade || "";
document.getElementById("estado").value=dados.uf || "";

}catch(e){

alert("Não foi possível consultar o CEP.");

}

}

function finalizar(){

let campos=[
"nome",
"whatsapp",
"cpf",
"cep",
"rua",
"numero",
"cidade",
"estado"
];

for(let campo of campos){

if(!document.getElementById(campo).value){

alert("Preencha todos os campos obrigatórios.");

return;

}

}

alert("Dados preenchidos com sucesso! Próxima etapa: pagamento.");

}

</script>

</body>
</html>
