*{

<body>

<header>

<div class="logo">VANTA</div>

</header>


<div class="container">

<h1>Finalizar compra</h1>


<div class="box">

<h2>Seus dados</h2>

<div id="erro" class="erro">
Preencha todos os campos obrigatórios.
</div>

<div id="sucesso" class="sucesso">
Pedido salvo com sucesso.
</div>

id="nome"

>

>

autocomplete="off"
>

id="cep"
type="text"
placeholder="CEP"
inputmode="numeric"
onblur="buscarCEP()"
autocomplete="postal-code"
>

id="rua"

>

>

id="complemento"

<script>


/* ================================
   CONFIGURAÇÃO SUPABASE
================================ */

const SUPABASE_URL =
"https://pzqgsbxuhsesfxhmgfbi.supabase.co";


/*
IMPORTANTE:

Cole aqui a sua Publishable key atual.

NÃO coloque Secret Key ou service_role.
*/

const SUPABASE_KEY =
"sb_publishable_bLqHB2EcCBMkhw4JLtH71A_xGOK0Pxh";


/* ================================
   CARRINHO
================================ */

let produto = JSON.parse(
localStorage.getItem("vantaCarrinho")
);

let resumo =
document.getElementById("resumo");


if(!produto){

resumo.innerHTML =
"Seu carrinho está vazio.";

document.getElementById("botao").disabled = true;

}else{

let subtotal =
Number(produto.preco) *
Number(produto.quantidade);

resumo.innerHTML = `

<div>
<strong>${produto.nome}</strong>
</div>

<div>
Tamanho: ${produto.tamanho}
</div>

<div>
Quantidade: ${produto.quantidade}
</div>

<div>
Preço: R$ ${Number(produto.preco)
.toFixed(2)
.replace(".",",")}
</div>

<div class="total">

Total: R$ ${subtotal
.toFixed(2)
.replace(".",",")}

</div>

`;

}


/* ================================
   BUSCAR CEP
================================ */

async function buscarCEP(){

let cep =
document.getElementById("cep")
.value
.replace(/\D/g,"");


if(cep.length !== 8) return;


try{

let resposta =
await fetch(
"https://viacep.com.br/ws/" +
cep +
"/json/"
);


let dados =
await resposta.json();


if(dados.erro){

return;

}


document.getElementById("rua").value =
dados.logradouro || "";


document.getElementById("cidade").value =
dados.localidade || "";


document.getElementById("estado").value =
dados.uf || "";


}catch(e){

console.log("Erro ao buscar CEP");

}

}


/* ================================
   SALVAR PEDIDO
================================ */

async function continuarPagamento(){


let nome =
document.getElementById("nome")
.value
.trim();


let whatsapp =
document.getElementById("whatsapp")
.value
.trim();


let cpf =
document.getElementById("cpf")
.value
.trim();


let cep =
document.getElementById("cep")
.value
.trim();


let rua =
document.getElementById("rua")
.value
.trim();


let numero =
document.getElementById("numero")
.value
.trim();


let complemento =
document.getElementById("complemento")
.value
.trim();


let cidade =
document.getElementById("cidade")
.value
.trim();


let estado =
document.getElementById("estado")
.value;


let erro =
document.getElementById("erro");


let botao =
document.getElementById("botao");


if(
!nome ||
!whatsapp ||
!cpf ||
!cep ||
!rua ||
!numero ||
!cidade ||
!estado ||
!produto
){

erro.style.display =
"block";

return;

}


erro.style.display =
"none";


botao.disabled =
true;

botao.innerText =
"SALVANDO PEDIDO...";


let total =
Number(produto.preco) *
Number(produto.quantidade);


/* ================================
   ITENS DO PEDIDO
================================ */

let itens = [

{

nome: produto.nome,

tamanho: produto.tamanho,

quantidade:
Number(produto.quantidade),

preco:
Number(produto.preco),

imagem:
produto.imagem || ""

}

];


/* ================================
   ENDEREÇO
================================ */

let endereco =
rua +
", " +
numero +
(complemento
? " - " + complemento
: "");


/* ================================
   ENVIAR PARA SUPABASE
================================ */

try{


let resposta =
await fetch(
SUPABASE_URL +
"/rest/v1/pedidos",
{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Prefer":
"return=representation"

},

body:JSON.stringify({

nome_cliente:
nome,

telefone:
whatsapp,

cpf:
cpf,

endereco:
endereco,

cidade:
cidade,

estado:
estado,

cep:
cep,

itens:
itens,

total:
total,

forma_pagamento:
"",

status:
"pendente"

})

});


let dados =
await resposta.json();


if(!resposta.ok){

console.error("ERRO SUPABASE:", dados);

alert(
"Erro do Supabase:\n\n" +
JSON.stringify(dados, null, 2)
);

throw new Error(
"Erro ao salvar pedido"
);

}

/* ================================
   PEGAR PEDIDO CRIADO
================================ */

let pedidoCriado =
dados[0];


if(!pedidoCriado){

throw new Error(
"Pedido não retornado pelo banco"
);

}


/* ================================
   SALVAR LOCALMENTE TAMBÉM
================================ */

let pedidoAtual = {

id:
pedidoCriado.id,

numero_pedido:
pedidoCriado.numero_pedido,

produto:
produto.nome,

imagem:
produto.imagem || "",

tamanho:
produto.tamanho,

quantidade:
produto.quantidade,

preco:
produto.preco,

total:
total,

nome:
nome,

whatsapp:
whatsapp,

cpf:
cpf,

endereco:
endereco +
" - " +
cidade +
"/" +
estado +
" - CEP " +
cep,

pagamento:
"",

status:
"pendente",

data:
new Date().toLocaleString("pt-BR")

};


localStorage.setItem(

"vantaPedidoAtual",

JSON.stringify(
pedidoAtual
)

);


/* ================================
   IR PARA PAGAMENTO
================================ */

window.location.href =
"pagamento.html";


}


/* ================================
   ERRO
================================ */

catch(e){

console.error(e);

erro.innerText =
"Não foi possível salvar o pedido. Tente novamente.";

erro.style.display =
"block";

botao.disabled =
false;

botao.innerText =
"CONTINUAR PARA PAGAMENTO";

}

}

</script>


</body>

</html>
