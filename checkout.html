<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Checkout | VANTA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0b0b;
  color:#fff;
}

header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #222;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:4px;
}

.container{
  max-width:600px;
  margin:40px auto;
  padding:20px;
}

h1{
  font-size:30px;
  margin-bottom:25px;
}

.box{
  background:#111;
  border:1px solid #222;
  border-radius:12px;
  padding:22px;
  margin-bottom:20px;
}

h2{
  font-size:18px;
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  color:#ccc;
}

input,
select{
  width:100%;
  padding:14px;
  margin-bottom:16px;
  border:1px solid #333;
  border-radius:8px;
  background:#181818;
  color:#fff;
  outline:none;
}

input:focus,
select:focus{
  border-color:#fff;
}

.linha{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.resumo{
  color:#bbb;
  line-height:1.7;
}

.item{
  padding:12px 0;
  border-bottom:1px solid #222;
}

.item:last-child{
  border-bottom:0;
}

.item strong{
  color:#fff;
}

.total{
  color:#fff;
  font-size:22px;
  font-weight:bold;
  margin-top:15px;
}

button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:8px;
  background:#fff;
  color:#000;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  background:#ddd;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

@media(max-width:500px){
  .linha{
    grid-template-columns:1fr;
    gap:0;
  }

  .container{
    margin:20px auto;
    padding:15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">VANTA</div>
</header>

<div class="container">

<h1>Checkout</h1>

<div class="box">

<h2>Seus dados</h2>

<label for="nome">Nome completo</label>
<input id="nome" type="text" placeholder="Seu nome completo">

<label for="whatsapp">WhatsApp</label>
<input id="whatsapp" type="tel" placeholder="(11) 99999-9999">

<label for="cpf">CPF</label>
<input id="cpf" type="text" placeholder="000.000.000-00">

<label for="cep">CEP</label>
<input id="cep" type="text" placeholder="00000-000" onblur="buscarCEP()">

<label for="rua">Rua</label>
<input id="rua" type="text" placeholder="Nome da rua">

<div class="linha">

  <div>
    <label for="numero">Número</label>
    <input id="numero" type="text" placeholder="123">
  </div>

  <div>
    <label for="complemento">Complemento</label>
    <input id="complemento" type="text" placeholder="Opcional">
  </div>

</div>

<label for="cidade">Cidade</label>
<input id="cidade" type="text" placeholder="Cidade">

<label for="estado">Estado</label>
<select id="estado">
  <option value="">Selecione</option>
  <option value="AC">AC</option>
  <option value="AL">AL</option>
  <option value="AP">AP</option>
  <option value="AM">AM</option>
  <option value="BA">BA</option>
  <option value="CE">CE</option>
  <option value="DF">DF</option>
  <option value="ES">ES</option>
  <option value="GO">GO</option>
  <option value="MA">MA</option>
  <option value="MT">MT</option>
  <option value="MS">MS</option>
  <option value="MG">MG</option>
  <option value="PA">PA</option>
  <option value="PB">PB</option>
  <option value="PR">PR</option>
  <option value="PE">PE</option>
  <option value="PI">PI</option>
  <option value="RJ">RJ</option>
  <option value="RN">RN</option>
  <option value="RS">RS</option>
  <option value="RO">RO</option>
  <option value="RR">RR</option>
  <option value="SC">SC</option>
  <option value="SP">SP</option>
  <option value="SE">SE</option>
  <option value="TO">TO</option>
</select>

</div>

<div class="box">

<h2>Resumo do pedido</h2>

<div id="resumo" class="resumo">
  Carregando...
</div>

</div>

<button id="botao" onclick="continuarPagamento()">
  CONTINUAR PARA PAGAMENTO
</button>

</div>

<script>

const SUPABASE_URL =
  "https://pzqgsbxuhsesfxhmgfbi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_bLqHB2EcCBMkhw4JLtH71A_xGOK0Pxh";

let carrinho =
  JSON.parse(localStorage.getItem("vantaCarrinho")) || [];

const resumo = document.getElementById("resumo");

function mostrarResumo(){

  if(!carrinho.length){

    resumo.innerHTML = "Seu carrinho está vazio.";
    return;
  }

  let total = 0;

  resumo.innerHTML = carrinho.map(item => {

    const preco = Number(item.preco) || 0;
    const quantidade = Number(item.quantidade) || 1;
    const subtotal = preco * quantidade;

    total += subtotal;

    return `
      <div class="item">
        <strong>${item.nome || "Produto"}</strong><br>
        Tamanho: ${item.tamanho || "Único"}<br>
        Quantidade: ${quantidade}<br>
        Preço: R$ ${preco.toFixed(2).replace(".",",")}<br>
        Subtotal: R$ ${subtotal.toFixed(2).replace(".",",")}
      </div>
    `;

  }).join("");

  resumo.innerHTML += `
    <div class="total">
      Total: R$ ${total.toFixed(2).replace(".",",")}
    </div>
  `;
}

async function buscarCEP(){

  const cep =
    document.getElementById("cep").value
    .replace(/\D/g,"");

  if(cep.length !== 8) return;

  try{

    const resposta =
      await fetch(
        `https://viacep.com.br/ws/${cep}/json/`
      );

    const dados = await resposta.json();

    if(dados.erro){
      return;
    }

    document.getElementById("rua").value =
      dados.logradouro || "";

    document.getElementById("cidade").value =
      dados.localidade || "";

    document.getElementById("estado").value =
      dados.uf || "";

  }catch(e){

    console.log("Erro ao buscar CEP:",e);

  }
}

function continuarPagamento(){

  const nome =
    document.getElementById("nome").value.trim();

  const whatsapp =
    document.getElementById("whatsapp").value.trim();

  const cpf =
    document.getElementById("cpf").value.trim();

  const cep =
    document.getElementById("cep").value.trim();

  const rua =
    document.getElementById("rua").value.trim();

  const numero =
    document.getElementById("numero").value.trim();

  const complemento =
    document.getElementById("complemento").value.trim();

  const cidade =
    document.getElementById("cidade").value.trim();

  const estado =
    document.getElementById("estado").value;

  if(!nome ||
     !whatsapp ||
     !cpf ||
     !cep ||
     !rua ||
     !numero ||
     !cidade ||
     !estado){

    alert("Preencha todos os campos obrigatórios.");
    return;
  }

  if(!carrinho.length){

    alert("Seu carrinho está vazio.");
    return;
  }

  let total = 0;

  const itens = carrinho.map(item => {

    const preco =
      Number(item.preco) || 0;

    const quantidade =
      Number(item.quantidade) || 1;

    total += preco * quantidade;

    return {
      nome: item.nome || "Produto",
      tamanho: item.tamanho || "",
      quantidade: quantidade,
      preco: preco,
      imagem: item.imagem || ""
    };

  });

  const endereco =
    `${rua}, ${numero}` +
    (complemento ? `, ${complemento}` : "");

  /*
    IMPORTANTE:

    Aqui NÃO criamos o pedido no Supabase.

    Apenas guardamos os dados temporariamente
    para que o pedido seja criado depois que
    o cliente escolher o pagamento.
  */

  const dadosCheckout = {

    nome: nome,
    whatsapp: whatsapp,
    cpf: cpf,
    endereco: endereco,
    cidade: cidade,
    estado: estado,
    cep: cep,
    itens: itens,
    total: total

  };

  localStorage.setItem(
    "vantaCheckout",
    JSON.stringify(dadosCheckout)
  );

  window.location.href = "pagamento.html";
}

mostrarResumo();

</script>

</body>
</html>
