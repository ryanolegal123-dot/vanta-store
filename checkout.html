<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Checkout | VANTA</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
}

header{
height:70px;
display:flex;
align-items:center;
justify-content:center;
border-bottom:1px solid #222;
}

.logo{
font-size:26px;
font-weight:900;
letter-spacing:4px;
}

.container{
max-width:700px;
margin:40px auto;
padding:20px;
}

h1{
font-size:30px;
margin-bottom:25px;
}

.box{
background:#111;
border:1px solid #222;
padding:22px;
border-radius:12px;
margin-bottom:20px;
}

h2{
font-size:18px;
margin-bottom:18px;
}

input,select{
width:100%;
padding:14px;
margin-bottom:12px;
background:#181818;
border:1px solid #333;
border-radius:8px;
color:#fff;
outline:none;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.resumo{
color:#bbb;
line-height:1.8;
}

.item-resumo{
padding:12px 0;
border-bottom:1px solid #222;
}

.item-resumo:last-child{
border-bottom:0;
}

.item-nome{
color:#fff;
font-weight:bold;
}

.total{
font-size:22px;
font-weight:bold;
color:#fff;
margin-top:15px;
}

button{
width:100%;
padding:17px;
border:0;
border-radius:8px;
background:#fff;
color:#000;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

button:hover{
background:#ddd;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

.erro{
color:#ff5555;
margin-bottom:15px;
display:none;
line-height:1.5;
}

.sucesso{
color:#62ff8a;
margin-bottom:15px;
display:none;
}

.aviso{
color:#777;
font-size:12px;
margin-top:10px;
line-height:1.5;
}

@media(max-width:600px){

.row{
grid-template-columns:1fr;
gap:0;
}

.container{
margin:20px auto;
padding:15px;
}

h1{
font-size:26px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">VANTA</div>

</header>


<div class="container">

<h1>Finalizar compra</h1>


<div class="box">

<h2>Seus dados</h2>

<div id="erro" class="erro">
Preencha todos os campos obrigatórios.
</div>

<input
id="nome"
type="text"
placeholder="Nome completo"
autocomplete="name"
>

<input
id="whatsapp"
type="tel"
placeholder="WhatsApp"
autocomplete="tel"
>

<input
id="cpf"
type="text"
placeholder="CPF"
inputmode="numeric"
autocomplete="off"
>

<input
id="cep"
type="text"
placeholder="CEP"
inputmode="numeric"
onblur="buscarCEP()"
autocomplete="postal-code"
>

<input
id="rua"
type="text"
placeholder="Rua"
autocomplete="street-address"
>

<div class="row">

<input
id="numero"
type="text"
placeholder="Número"
>

<input
id="complemento"
type="text"
placeholder="Complemento"
>

</div>

<input
id="cidade"
type="text"
placeholder="Cidade"
autocomplete="address-level2"
>

<select id="estado">

<option value="">Estado</option>

<option>AC</option>
<option>AL</option>
<option>AP</option>
<option>AM</option>
<option>BA</option>
<option>CE</option>
<option>DF</option>
<option>ES</option>
<option>GO</option>
<option>MA</option>
<option>MT</option>
<option>MS</option>
<option>MG</option>
<option>PA</option>
<option>PB</option>
<option>PR</option>
<option>PE</option>
<option>PI</option>
<option>RJ</option>
<option>RN</option>
<option>RS</option>
<option>RO</option>
<option>RR</option>
<option>SC</option>
<option>SP</option>
<option>SE</option>
<option>TO</option>

</select>

</div>


<div class="box">

<h2>Resumo do pedido</h2>

<div id="resumo" class="resumo">
Carregando...
</div>

</div>


<button
id="botao"
onclick="continuarPagamento()"
>

CONTINUAR PARA PAGAMENTO

</button>

</div>


<script>


/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://pzqgsbxuhsesfxhmgfbi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_bLqHB2EcCBMkhw4JLtH71A_xGOK0Pxh";


/* =====================================
   CARRINHO
===================================== */

let carrinho =
JSON.parse(
localStorage.getItem("vantaCarrinho")
) || [];


/*
Compatibilidade com carrinho antigo:
se existir um único objeto, transforma em array.
*/

if(
!Array.isArray(carrinho) &&
carrinho &&
carrinho.nome
){

carrinho = [carrinho];

localStorage.setItem(
"vantaCarrinho",
JSON.stringify(carrinho)
);

}


const resumo =
document.getElementById("resumo");


/* =====================================
   DINHEIRO
===================================== */

function dinheiro(valor){

return Number(valor || 0)
.toFixed(2)
.replace(".",",");

}


/* =====================================
   TOTAL
===================================== */

function calcularTotal(){

return carrinho.reduce(
(total, produto) => {

let preco =
Number(produto.preco) || 0;

let quantidade =
Number(produto.quantidade) || 0;

return total +
(preco * quantidade);

},
0
);

}


/* =====================================
   MOSTRAR RESUMO
===================================== */

function mostrarResumo(){

if(
!Array.isArray(carrinho) ||
carrinho.length === 0
){

resumo.innerHTML =
"Seu carrinho está vazio.";

document.getElementById(
"botao"
).disabled = true;

return;

}


let html = "";


carrinho.forEach(produto => {

let preco =
Number(produto.preco) || 0;

let quantidade =
Number(produto.quantidade) || 0;

let subtotal =
preco * quantidade;


html += `

<div class="item-resumo">

<div class="item-nome">
${produto.nome || "Produto"}
</div>

<div>
Tamanho: ${produto.tamanho || "-"}
</div>

<div>
Quantidade: ${quantidade}
</div>

<div>
R$ ${dinheiro(preco)} cada
</div>

<div>
Subtotal: R$ ${dinheiro(subtotal)}
</div>

</div>

`;

});


html += `

<div class="total">

Total:
R$ ${dinheiro(calcularTotal())}

</div>

`;


resumo.innerHTML = html;

}


mostrarResumo();


/* =====================================
   BUSCAR CEP
===================================== */

async function buscarCEP(){

let cep =
document.getElementById("cep")
.value
.replace(/\D/g,"");


if(cep.length !== 8){

return;

}


try{

let resposta =
await fetch(
"https://viacep.com.br/ws/" +
cep +
"/json/"
);


let dados =
await resposta.json();


if(dados.erro){

return;

}


document.getElementById("rua").value =
dados.logradouro || "";


document.getElementById("cidade").value =
dados.localidade || "";


document.getElementById("estado").value =
dados.uf || "";


}catch(e){

console.log(
"Erro ao buscar CEP:",
e
);

}

}


/* =====================================
   FINALIZAR
===================================== */

async function continuarPagamento(){

let nome =
document.getElementById("nome")
.value
.trim();


let whatsapp =
document.getElementById("whatsapp")
.value
.trim();


let cpf =
document.getElementById("cpf")
.value
.trim();


let cep =
document.getElementById("cep")
.value
.trim();


let rua =
document.getElementById("rua")
.value
.trim();


let numero =
document.getElementById("numero")
.value
.trim();


let complemento =
document.getElementById("complemento")
.value
.trim();


let cidade =
document.getElementById("cidade")
.value
.trim();


let estado =
document.getElementById("estado")
.value;


let erro =
document.getElementById("erro");


let botao =
document.getElementById("botao");


/* =====================================
   VALIDAÇÃO
===================================== */

if(

!nome ||
!whatsapp ||
!cpf ||
!cep ||
!rua ||
!numero ||
!cidade ||
!estado ||
!Array.isArray(carrinho) ||
carrinho.length === 0

){

erro.innerText =
"Preencha todos os campos obrigatórios.";

erro.style.display =
"block";

return;

}


erro.style.display =
"none";


botao.disabled =
true;

botao.innerText =
"SALVANDO PEDIDO...";


/* =====================================
   TOTAL
===================================== */

let total =
calcularTotal();


/* =====================================
   ITENS
===================================== */

let itens =
carrinho.map(produto => ({

nome:
produto.nome || "",

tamanho:
produto.tamanho || "",

quantidade:
Number(produto.quantidade) || 0,

preco:
Number(produto.preco) || 0,

imagem:
produto.imagem || ""

}));


/* =====================================
   ENDEREÇO
===================================== */

let endereco =
rua +
", " +
numero +
(
complemento
? " - " + complemento
: ""
);


/* =====================================
   ENVIAR SUPABASE
===================================== */

try{

let resposta =
await fetch(
SUPABASE_URL +
"/rest/v1/pedidos",
{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Prefer":
"return=representation"

},

body:JSON.stringify({

nome_cliente:
nome,

telefone:
whatsapp,

cpf:
cpf,

endereco:
endereco,

cidade:
cidade,

estado:
estado,

cep:
cep,

itens:
itens,

total:
total,

forma_pagamento:
"",

status:
"pendente"

})

});


let dados =
await resposta.json();


/* =====================================
   ERRO SUPABASE
===================================== */

if(!resposta.ok){

console.error(
"ERRO SUPABASE:",
dados
);

alert(
"Erro ao salvar pedido:\n\n" +
JSON.stringify(
dados,
null,
2
)
);

throw new Error(
"Erro ao salvar pedido"
);

}


/* =====================================
   PEDIDO CRIADO
===================================== */

let pedidoCriado =
dados[0];


if(!pedidoCriado){

throw new Error(
"Pedido não retornado pelo Supabase"
);

}


/* =====================================
   SALVAR PEDIDO LOCAL
===================================== */

let pedidoAtual = {

id:
pedidoCriado.id,

numero_pedido:
pedidoCriado.numero_pedido,

nome:
nome,

whatsapp:
whatsapp,

cpf:
cpf,

endereco:
endereco +
" - " +
cidade +
"/" +
estado +
" - CEP " +
cep,

itens:
itens,

total:
total,

pagamento:
"",

status:
"pendente",

data:
new Date()
.toLocaleString("pt-BR")

};


localStorage.setItem(

"vantaPedidoAtual",

JSON.stringify(
pedidoAtual
)

);


/* =====================================
   IR PARA PAGAMENTO
===================================== */

window.location.href =
"pagamento.html";

}


/* =====================================
   ERRO GERAL
===================================== */

catch(e){

console.error(e);

botao.disabled =
false;

botao.innerText =
"CONTINUAR PARA PAGAMENTO";

}

}

</script>

</body>

</html>
