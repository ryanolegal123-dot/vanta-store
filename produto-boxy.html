<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxy Premium White — VANTA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

header{
    height:70px;
    background:#0b0b0b;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:3px;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:50px auto;
    padding:20px;
}

.product{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
    background:white;
    padding:30px;
    border-radius:12px;
}

.product img{
    width:100%;
    height:550px;
    object-fit:cover;
    border-radius:8px;
}

.info{
    padding:20px 0;
}

.tag{
    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;
    color:#777;
}

h1{
    font-size:38px;
    margin:12px 0 20px;
}

.price{
    font-size:30px;
    font-weight:bold;
}

.old-price{
    color:#999;
    text-decoration:line-through;
    margin-left:10px;
    font-size:17px;
}

.installment{
    color:#555;
    margin:8px 0 25px;
}

.description{
    color:#555;
    line-height:1.6;
    margin-bottom:25px;
}

.label{
    font-weight:bold;
    margin-bottom:10px;
}

.sizes{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.size{
    width:50px;
    height:45px;
    border:1px solid #ccc;
    background:white;
    cursor:pointer;
}

.size:hover{
    background:#111;
    color:white;
}

.quantity{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.quantity button{
    width:35px;
    height:35px;
    border:1px solid #ccc;
    background:white;
    cursor:pointer;
}

#quantidade{
    font-weight:bold;
}

.cart{
    width:100%;
    padding:18px;
    background:#111;
    color:white;
    border:none;
    font-weight:bold;
    cursor:pointer;
    letter-spacing:1px;
}

.cart:hover{
    background:#333;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:#111;
    text-decoration:none;
}

@media(max-width:700px){
    .product{
        grid-template-columns:1fr;
        gap:20px;
    }

    .product img{
        height:450px;
    }

    h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">VANTA</div>

    <nav>
        <a href="index.html">PRODUTOS</a>
        <a href="index.html">SOBRE</a>
        <a href="#">🛒</a>
    </nav>
</header>

<div class="container">

<a href="index.html" class="back">← Voltar para produtos</a>

<div class="product">

    <img src="https://images.unsplash.com/photo-1627225924765-552d49cf47ad?auto=format&fit=crop&w=1000&q=90">

    <div class="info">

        <div class="tag">VANTA ESSENTIALS</div>

        <h1>Boxy Premium White</h1>

        <div>
            <span class="price">R$ 79,90</span>
            <span class="old-price">R$ 109,90</span>
        </div>

        <div class="installment">
            ou 3x de R$ 26,63 sem juros
        </div>

        <p class="description">
            Camiseta masculina boxy de visual minimalista.
            Modelagem mais ampla, caimento estruturado e
            estética urbana para compor qualquer look.
        </p>

        <div class="label">TAMANHO</div>

        <div class="sizes">
            <button class="size">P</button>
            <button class="size">M</button>
            <button class="size">G</button>
            <button class="size">GG</button>
        </div>

        <div class="label">QUANTIDADE</div>

        <div class="quantity">
            <button onclick="diminuir()">−</button>
            <span id="quantidade">1</span>
            <button onclick="aumentar()">+</button>
        </div>

        <button class="cart" onclick="adicionarCarrinho()">
            ADICIONAR AO CARRINHO
        </button>

    </div>

</div>

</div>

<script>

let quantidade = 1;

function aumentar(){
    quantidade++;
    document.getElementById("quantidade").innerText = quantidade;
}

function diminuir(){
    if(quantidade > 1){
        quantidade--;
        document.getElementById("quantidade").innerText = quantidade;
    }
}

function adicionarCarrinho(){

    const produto = {
        nome: "Boxy Premium White",
        preco: 79.90,
        tamanho: "M",
        quantidade: quantidade,
        imagem: "https://images.unsplash.com/photo-1627225924765-552d49cf47ad?auto=format&fit=crop&w=1000&q=90"
    };

    localStorage.setItem(
        "vantaCarrinho",
        JSON.stringify(produto)
    );

    alert("Produto adicionado ao carrinho!");
}

</script>

</body>
  </html>
