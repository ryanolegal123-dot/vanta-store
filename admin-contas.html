<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Contas | ANARKA Admin</title>

<link rel="icon" href="/anarka-favicon.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif
}

body{
  background:#050505;
  color:#fff;
  min-height:100vh
}

a{
  color:inherit;
  text-decoration:none
}

button,
input{
  font:inherit
}

.topbar{
  background:#d60000;
  padding:9px 15px;
  text-align:center;
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase
}

header{
  height:82px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #242424
}

.logo{
  width:125px;
  height:65px;
  object-fit:contain
}

.header-actions{
  display:flex;
  gap:8px
}

.header-actions a,
.header-actions button{
  border:1px solid #333;
  background:#080808;
  color:#fff;
  padding:11px 13px;
  cursor:pointer;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.2px;
  text-transform:uppercase
}

.header-actions a:hover,
.header-actions button:hover{
  border-color:#d60000;
  color:#d60000
}

main{
  width:90%;
  max-width:1200px;
  margin:auto;
  padding:60px 0 100px
}

.label{
  color:#d60000;
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
  text-transform:uppercase
}

h1{
  margin-top:10px;
  font-size:clamp(50px,8vw,90px);
  line-height:.84;
  letter-spacing:-4px;
  text-transform:uppercase
}

h1 span{
  color:transparent;
  -webkit-text-stroke:1px #fff
}

.sub{
  margin-top:20px;
  color:#777;
  line-height:1.7;
  font-size:12px;
  max-width:700px
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:32px
}

.sum{
  border:1px solid #292929;
  background:#090909;
  padding:19px
}

.sum small{
  color:#666;
  font-size:8px;
  font-weight:900;
  letter-spacing:1.5px
}

.sum strong{
  display:block;
  margin-top:12px;
  font-size:27px
}

.tools{
  display:flex;
  gap:8px;
  margin:28px 0
}

.tools input{
  flex:1;
  border:1px solid #303030;
  background:#090909;
  color:#fff;
  padding:14px;
  outline:0
}

.tools input:focus{
  border-color:#d60000
}

.atualizar{
  min-height:46px;
  padding:0 16px;
  border:1px solid #333;
  background:#090909;
  color:#aaa;
  cursor:pointer;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase
}

.atualizar:hover{
  border-color:#d60000;
  color:#fff
}

.list{
  display:grid;
  gap:12px
}

.card{
  border:1px solid #292929;
  background:#090909
}

.card.admin{
  border-color:#5d1b1b;
  background:#0d0707
}

.card.conhecido{
  border-color:#6e5a1d
}

.card-head{
  padding:18px 20px;
  border-bottom:1px solid #222;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start
}

.card-head small{
  display:block;
  color:#666;
  font-size:8px;
  font-weight:900;
  letter-spacing:1.4px
}

.card-head h2{
  margin-top:6px;
  font-size:20px;
  text-transform:uppercase;
  word-break:break-word
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:flex-end
}

.badge{
  padding:8px 10px;
  border:1px solid #333;
  background:#080808;
  color:#aaa;
  font-size:8px;
  font-weight:900;
  letter-spacing:1.2px;
  text-transform:uppercase;
  white-space:nowrap
}

.badge.ok{
  border-color:#245b2a;
  background:#071008;
  color:#8ddd95
}

.badge.admin{
  border-color:#6d1717;
  background:#130707;
  color:#ff7b7b
}

.badge.conhecido{
  border-color:#6e5a1d;
  background:#151105;
  color:#ffd76a
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  padding:0 20px
}

.block{
  padding:20px 0
}

.block+.block{
  padding-left:20px;
  border-left:1px solid #222
}

.dado{
  margin-bottom:14px
}

.dado:last-child{
  margin-bottom:0
}

.dado small{
  display:block;
  color:#666;
  font-size:8px;
  font-weight:900;
  letter-spacing:1.3px;
  margin-bottom:4px
}

.dado div{
  font-size:12px;
  line-height:1.6;
  word-break:break-word
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px
}

.stat{
  border:1px solid #222;
  background:#060606;
  padding:14px
}

.stat small{
  color:#555;
  font-size:8px;
  font-weight:900;
  letter-spacing:1px
}

.stat strong{
  display:block;
  margin-top:8px;
  font-size:20px
}

.acoes-conta{
  padding:18px 20px;
  border-top:1px solid #222;
  display:flex;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap
}

.btn-tag{
  min-height:44px;
  padding:0 16px;
  border:1px solid #6e5a1d;
  background:#151105;
  color:#ffd76a;
  cursor:pointer;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.2px;
  text-transform:uppercase
}

.btn-tag:hover{
  background:#ffd76a;
  border-color:#ffd76a;
  color:#000
}

.btn-tag.remover{
  border-color:#6d1717;
  background:#160707;
  color:#ff7b7b
}

.btn-tag.remover:hover{
  background:#d60000;
  border-color:#d60000;
  color:#fff
}

.btn-tag:disabled{
  opacity:.45;
  cursor:not-allowed
}

.btn-perigo{
  min-height:44px;
  padding:0 16px;
  border:1px solid #6d1717;
  background:#160707;
  color:#ff7b7b;
  cursor:pointer;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.2px;
  text-transform:uppercase
}

.btn-perigo:hover{
  background:#d60000;
  border-color:#d60000;
  color:#fff
}

.btn-perigo:disabled{
  opacity:.45;
  cursor:not-allowed
}

.feedback-conta{
  width:100%;
  min-height:15px;
  color:#777;
  font-size:9px;
  text-align:right
}

.feedback-conta.ok{
  color:#8ddd95
}

.feedback-conta.erro{
  color:#ff7b7b
}

.empty{
  border:1px solid #292929;
  padding:35px;
  color:#777;
  text-align:center
}

.loading,
.denied{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#777;
  font-size:11px;
  letter-spacing:2px
}

.denied{
  display:none
}

.panel{
  display:none
}

.rodape-info{
  margin-top:18px;
  color:#444;
  font-size:9px;
  letter-spacing:1px;
  text-align:right
}

@media(max-width:760px){

  header{
    height:72px;
    padding:0 4%
  }

  .logo{
    width:100px
  }

  .summary{
    grid-template-columns:1fr 1fr
  }

  .grid{
    grid-template-columns:1fr
  }

  .block+.block{
    padding-left:0;
    border-left:0;
    border-top:1px solid #222
  }

  .tools{
    flex-direction:column
  }

  main{
    width:92%;
    padding-top:45px
  }

  .card-head{
    flex-direction:column
  }

  .badges{
    justify-content:flex-start
  }

  .acoes-conta{
    justify-content:stretch
  }

  .acoes-conta button{
    width:100%
  }

}
</style>
</head>

<body>

<div
  id="loading"
  class="loading"
>
  VERIFICANDO ADMINISTRADOR...
</div>

<div
  id="denied"
  class="denied"
>
  <div>
    ACESSO NEGADO.
    <br><br>
    <a href="index.html">
      ← VOLTAR À LOJA
    </a>
  </div>
</div>

<div
  id="panel"
  class="panel"
>

  <div class="topbar">
    ANARKA — CONTAS CADASTRADAS
  </div>

  <header>

    <a href="index.html">

      <img
        src="/anarka-logo.png"
        class="logo"
        alt="ANARKA"
      >

    </a>

    <div class="header-actions">

      <a href="admin.html">
        ← PAINEL
      </a>

      <button id="sair">
        SAIR
      </button>

    </div>

  </header>

  <main>

    <div class="label">
      ANARKA / ADMIN
    </div>

    <h1>
      CON<span>TAS.</span>
    </h1>

    <p class="sub">
      Visualize as contas cadastradas, controle pedidos

      de qualquer conta.
    </p>

    <section class="summary">

      <div class="sum">
        <small>CONTAS</small>
        <strong id="sumContas">0</strong>

      </div>

      <div class="sum">
        <small>ADMINS</small>
        <strong id="sumAdmins">0</strong>
      </div>

      <div class="sum">

        <strong id="sumConhecidos">0</strong>
      </div>

    </section>

      <input

</div>

<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase =
  createClient(
    "https://pzqgsbxuhsesfxhmgfbi.supabase.co",
    "sb_publishable_bLqHB2EcCBMkhw4JLtH71A_xGOK0Pxh"
  );


const loading =
  document.getElementById(
    "loading"
  );


const denied =
  document.getElementById(
    "denied"
  );


const panel =
  document.getElementById(
    "panel"
  );


const lista =
  document.getElementById(
    "lista"
  );


const busca =
  document.getElementById(
    "busca"
  );


const atualizar =
  document.getElementById(
    "atualizar"
  );


const rodapeInfo =
  document.getElementById(
    "rodapeInfo"
  );


let contas = [];

let atualizando = false;


/* ==========================
   UTILIDADES
========================== */

function esc(v){

  const d =
    document.createElement(
      "div"
    );

  d.textContent =
    v ?? "";

  return d.innerHTML;

}


function dataBR(v){

  if(!v){
    return "—";
  }


  const d =
    new Date(v);


  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return "—";
  }


  return d.toLocaleString(
    "pt-BR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* ==========================
   RESUMO
========================== */

function atualizarResumo(){

  document
    .getElementById(
      "sumContas"
    )
    .textContent =
      contas.length;


  document
    .getElementById(
      "sumConfirmadas"
    )
    .textContent =
      contas
        .filter(
          c =>
            c.email_confirmado
        )
        .length;


  document
    .getElementById(
      "sumAdmins"
    )
    .textContent =
      contas
        .filter(
          c =>
            c.administrador
        )
        .length;


  document
    .getElementById(
      "sumConhecidos"
    )
    .textContent =
      contas
        .filter(
          c =>
            c.tag_status ===
            "aprovado"
        )
        .length;

}


/* ==========================
   RENDER
========================== */

function render(
  dados
){

  if(
    !dados.length
  ){

    lista.innerHTML =
      '<div class="empty">NENHUMA CONTA ENCONTRADA.</div>';

    return;

  }


  lista.innerHTML =
    dados
      .map(
        c=>{

          const totalPedidos =
            Number(
              c.total_pedidos ||
              0
            );


          const totalEncomendas =
            Number(
              c.total_encomendas ||
              0
            );


          const conhecido =
            c.tag_status ===
            "aprovado";


          return `

            <article
              class="card ${
                c.administrador
                  ? "admin"
                  : ""
              } ${
                conhecido
                  ? "conhecido"
                  : ""
              }"
            >

              <div class="card-head">

                <div>

                  <small>
                    CADASTRADA EM
                    ${dataBR(
                      c.criado_em
                    )}
                  </small>

                  <h2>
                    ${esc(
                      c.nome ||
                      "Cliente"
                    )}
                  </h2>

                </div>


                <div class="badges">

                  ${
                    c.email_confirmado
                      ?
                      '<span class="badge ok">E-MAIL CONFIRMADO</span>'
                      :
                      '<span class="badge">E-MAIL PENDENTE</span>'
                  }


                  ${
                    c.administrador
                      ?
                      '<span class="badge admin">ADMIN</span>'
                      :
                      ""
                  }


                  ${
                    conhecido
                      ?
                      `
                        <span class="badge conhecido">
                          CONHECIDO
                          ${
                            c.tag_codigo
                              ?
                              "— " +
                              esc(
                                c.tag_codigo
                              )
                              :
                              ""
                          }
                        </span>
                      `
                      :
                      ""
                  }

                </div>

              </div>


              <div class="grid">

                <div class="block">

                  <div class="dado">

                    <small>
                      E-MAIL
                    </small>

                    <div>
                      ${esc(
                        c.email ||
                        "—"
                      )}
                    </div>

                  </div>


                  <div class="dado">

                    <small>
                      ÚLTIMO ACESSO
                    </small>

                    <div>
                      ${dataBR(
                        c.ultimo_acesso
                      )}
                    </div>

                  </div>


                  <div class="dado">

                    <small>
                      TAG CONHECIDO
                    </small>

                    <div>

                      ${
                        conhecido
                          ?
                          `
                            <strong style="color:#ffd76a">
                              ATIVA
                            </strong>

                            ${
                              c.tag_codigo
                                ?
                                `
                                  <br>
                                  Código:
                                  ${esc(
                                    c.tag_codigo
                                  )}
                                `
                                :
                                ""
                            }
                          `
                          :
                          c.tag_status
                            ?
                            `
                              Status:
                              ${esc(
                                c.tag_status
                              )}
                            `
                            :
                            "SEM TAG"
                      }

                    </div>

                  </div>

                </div>


                <div class="block">

                  <div class="dado">

                    <small>
                      ID DA CONTA
                    </small>

                    <div>
                      ${esc(
                        c.id
                      )}
                    </div>

                  </div>


                  <div class="stats">

                    <div class="stat">

                      <small>
                        PEDIDOS
                      </small>

                      <strong>
                        ${totalPedidos}
                      </strong>

                    </div>


                    <div class="stat">

                      <small>
                        ENCOMENDAS
                      </small>

                      <strong>
                        ${totalEncomendas}
                      </strong>

                    </div>

                  </div>

                </div>

              </div>


              <div class="acoes-conta">

                ${
                  conhecido
                    ?
                    `
                      <button
                        type="button"
                        class="btn-tag remover"
                        data-remover-tag="${esc(
                          c.id
                        )}"
                        data-nome="${esc(
                          c.nome ||
                          "Cliente"
                        )}"
                      >
                        REMOVER TAG CONHECIDO
                      </button>
                    `
                    :
                    `
                      <button
                        type="button"
                        class="btn-tag"
                        data-dar-tag="${esc(
                          c.id
                        )}"
                        data-nome="${esc(
                          c.nome ||
                          "Cliente"
                        )}"
                      >
                        DAR TAG CONHECIDO
                      </button>
                    `
                }


                ${
                  totalPedidos > 0
                    ?
                    `
                      <button
                        type="button"
                        class="btn-perigo"
                        data-excluir-pedidos="${esc(
                          c.id
                        )}"
                        data-nome="${esc(
                          c.nome ||
                          "Cliente"
                        )}"
                        data-email="${esc(
                          c.email ||
                          ""
                        )}"
                        data-total="${totalPedidos}"
                      >
                        EXCLUIR TODOS OS PEDIDOS
                        (${totalPedidos})
                      </button>
                    `
                    :
                    `
                      <button
                        type="button"
                        class="btn-perigo"
                        disabled
                      >
                        NENHUM PEDIDO PARA EXCLUIR
                      </button>
                    `
                }


                <div
                  class="feedback-conta"
                  data-feedback="${esc(
                    c.id
                  )}"
                ></div>

              </div>

            </article>

          `;

        }
      )
      .join("");


  document
    .querySelectorAll(
      "[data-dar-tag]"
    )
    .forEach(
      botao=>{

        botao.addEventListener(
          "click",
          ()=>darTagConhecido(
            botao
          )
        );

      }
    );


  document
    .querySelectorAll(
      "[data-remover-tag]"
    )
    .forEach(
      botao=>{

        botao.addEventListener(
          "click",
          ()=>removerTagConhecido(
            botao
          )
        );

      }
    );


  document
    .querySelectorAll(
      "[data-excluir-pedidos]"
    )
    .forEach(
      botao=>{

        botao.addEventListener(
          "click",
          ()=>excluirPedidosConta(
            botao
          )
        );

      }
    );

}


/* ==========================
   DAR TAG CONHECIDO
========================== */

async function darTagConhecido(
  botao
){

  const userId =
    botao.dataset.darTag;


  const nome =
    botao.dataset.nome ||
    "Cliente";


  if(
    !userId
  ){
    return;
  }


  const confirmar =
    window.confirm(
      `Dar TAG CONHECIDO para ${nome}?\n\nA conta passará a ter acesso aos benefícios de conhecido.`
    );


  if(
    !confirmar
  ){
    return;
  }


  botao.disabled =
    true;


  botao.textContent =
    "LIBERANDO TAG...";


  const {
    data,
    error
  } =
    await supabase.rpc(
      "admin_conceder_tag_conhecido",
      {
        p_user_id:userId
      }
    );


  if(error){

    console.error(
      "Erro ao conceder tag:",
      error
    );


    botao.disabled =
      false;


    botao.textContent =
      "DAR TAG CONHECIDO";


    alert(
      "Não foi possível liberar a TAG CONHECIDO."
    );


    return;

  }


  const resultado =
    Array.isArray(data)
      ?
      data[0]
      :
      data;


  const codigo =
    resultado?.codigo ||
    "";


  await carregarContas(
    true
  );


  alert(
    codigo
      ?
      `TAG CONHECIDO liberada para ${nome}.\n\nCódigo: ${codigo}`
      :
      `TAG CONHECIDO liberada para ${nome}.`
  );

}


/* ==========================
   REMOVER TAG
========================== */

async function removerTagConhecido(
  botao
){

  const userId =
    botao.dataset.removerTag;


  const nome =
    botao.dataset.nome ||
    "Cliente";


  if(
    !userId
  ){
    return;
  }


  const confirmar =
    window.confirm(
      `Remover a TAG CONHECIDO de ${nome}?\n\nA conta deixará de ter os benefícios dessa tag.`
    );


  if(
    !confirmar
  ){
    return;
  }


  botao.disabled =
    true;


  botao.textContent =
    "REMOVENDO TAG...";


  const {
    data,
    error
  } =
    await supabase.rpc(
      "admin_remover_tag_conhecido",
      {
        p_user_id:userId
      }
    );


  if(error){

    console.error(
      "Erro ao remover tag:",
      error
    );


    botao.disabled =
      false;


    botao.textContent =
      "REMOVER TAG CONHECIDO";


    alert(
      "Não foi possível remover a TAG CONHECIDO."
    );


    return;

  }


  await carregarContas(
    true
  );


  alert(
    data
      ?
      `TAG CONHECIDO removida de ${nome}.`
      :
      `${nome} não possuía TAG CONHECIDO.`
  );

}


/* ==========================
   EXCLUIR PEDIDOS DA CONTA
========================== */

async function excluirPedidosConta(
  botao
){

  const userId =
    botao.dataset.excluirPedidos;


  const nome =
    botao.dataset.nome ||
    "Cliente";


  const email =
    botao.dataset.email ||
    "";


  const total =
    Number(
      botao.dataset.total ||
      0
    );


  if(
    !userId ||
    total <= 0
  ){
    return;
  }


  const confirmar =
    window.confirm(
      `ATENÇÃO!\n\nVocê está prestes a excluir TODOS os ${total} pedido(s) de:\n\n${nome}\n${email}\n\nA conta continuará existindo e as encomendas não serão apagadas.\n\nDeseja continuar?`
    );


  if(
    !confirmar
  ){
    return;
  }


  const codigo =
    window.prompt(
      `Para confirmar a exclusão definitiva dos pedidos de ${nome}, digite:\n\nEXCLUIR`
    );


  if(
    codigo !==
    "EXCLUIR"
  ){

    if(
      codigo !== null
    ){

      alert(
        "Confirmação incorreta. Nenhum pedido foi apagado."
      );

    }


    return;

  }


  const feedback =
    document.querySelector(
      `[data-feedback="${CSS.escape(
        String(
          userId
        )
      )}"]`
    );


  botao.disabled =
    true;


  botao.textContent =
    "EXCLUINDO PEDIDOS...";


  if(
    feedback
  ){

    feedback.className =
      "feedback-conta";


    feedback.textContent =
      "APAGANDO PEDIDOS...";

  }


  const {
    data,
    error
  } =
    await supabase
      .from(
        "pedidos"
      )
      .delete()
      .eq(
        "user_id",
        userId
      )
      .select(
        "id"
      );


  if(error){

    console.error(
      "Erro ao excluir pedidos da conta:",
      error
    );


    botao.disabled =
      false;


    botao.textContent =
      `EXCLUIR TODOS OS PEDIDOS (${total})`;


    if(
      feedback
    ){

      feedback.className =
        "feedback-conta erro";


      feedback.textContent =
        "ERRO AO EXCLUIR PEDIDOS.";

    }


    return;

  }


  const apagados =
    Array.isArray(
      data
    )
      ?
      data.length
      :
      0;


  await carregarContas(
    true
  );


  alert(
    `${apagados} pedido(s) de ${nome} foram excluídos definitivamente.\n\nA conta e as encomendas foram mantidas.`
  );

}


/* ==========================
   BUSCA
========================== */

function aplicarBusca(){

  const q =
    busca.value
      .trim()
      .toLowerCase();


  if(
    !q
  ){

    render(
      contas
    );

    return;

  }


  render(
    contas.filter(
      c =>
        [
          c.nome,
          c.email,
          c.id,
          c.tag_status,
          c.tag_codigo
        ]
          .join(" ")
          .toLowerCase()
          .includes(q)
    )
  );

}


/* ==========================
   CARREGAR CONTAS
========================== */

async function carregarContas(
  silencioso=false
){

  if(
    atualizando
  ){
    return;
  }


  atualizando =
    true;


  if(
    !silencioso
  ){

    atualizar.disabled =
      true;


    atualizar.textContent =
      "ATUALIZANDO...";

  }


  const {
    data,
    error
  } =
    await supabase.rpc(
      "listar_usuarios_admin_v2"
    );


  if(
    !silencioso
  ){

    atualizar.disabled =
      false;


    atualizar.textContent =
      "ATUALIZAR";

  }


  atualizando =
    false;


  if(error){

    console.error(
      "Erro ao carregar contas:",
      error
    );


    lista.innerHTML =
      '<div class="empty">ERRO AO CARREGAR CONTAS.</div>';


    return;

  }


  contas =
    data ||
    [];


  atualizarResumo();


  aplicarBusca();


  rodapeInfo.textContent =
    "ATUALIZADO: " +
    new Date()
      .toLocaleTimeString(
        "pt-BR",
        {
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }
      );

}


/* ==========================
   INICIAR
========================== */

async function iniciar(){

  const {
    data:{
      user
    },
    error
  } =
    await supabase
      .auth
      .getUser();


  if(
    error ||
    !user
  ){

    loading.style.display =
      "none";


    denied.style.display =
      "flex";


    return;

  }


  const {
    data:admin,
    error:adminErro
  } =
    await supabase
      .from(
        "admins"
      )
      .select(
        "user_id"
      )
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(
    adminErro ||
    !admin
  ){

    loading.style.display =
      "none";


    denied.style.display =
      "flex";


    return;

  }


  await carregarContas();


  loading.style.display =
    "none";


  panel.style.display =
    "block";


  setInterval(
    ()=>{

      if(
        document.visibilityState ===
        "visible"
      ){

        carregarContas(
          true
        );

      }

    },
    10000
  );

}


/* ==========================
   EVENTOS
========================== */

busca.addEventListener(
  "input",
  aplicarBusca
);


atualizar.addEventListener(
  "click",
  ()=>carregarContas()
);


document
  .getElementById(
    "sair"
  )
  .addEventListener(
    "click",
    async ()=>{

      await supabase
        .auth
        .signOut();


      location.replace(
        "login.html"
      );

    }
  );


await iniciar();

</script>
